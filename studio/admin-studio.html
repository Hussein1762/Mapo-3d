
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mapo 3D Studio</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#101722;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
header,footer{background:#101722;padding:11px 12px;border-color:#39485d;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #39485d;min-height:62px}
footer{border-top:1px solid #39485d;padding-bottom:calc(11px + env(safe-area-inset-bottom))}
#mapwrap{position:relative;flex:1;min-height:150px}
#map{position:absolute;inset:0}
.btn{background:#347ff0;color:#fff;border:0;border-radius:10px;padding:11px;margin:3px;font-size:14px}
.alt{background:#29384c}
.hint{font-size:12px;color:#bbc6d5;line-height:1.5;margin:0 0 7px}
.coords{font-size:12px;color:#a9caff;margin:0 0 8px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.row{display:flex;gap:6px;flex-wrap:wrap}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:9;align-items:flex-end}
.sheet{background:#192638;border-radius:20px 20px 0 0;border:1px solid #40516a;padding:17px;width:100%;max-height:82%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.sheet p{font-size:12px;color:#bbc6d5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:#29394f;color:#fff;border:1px solid #40516a;border-radius:12px;padding:14px 8px;text-align:right}
.choice b{display:block}
.choice small{color:#bac6d6}
.field{display:block;margin:12px 0 5px;font-size:13px;color:#cbd5e1}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #50617a;background:#101722;color:#fff;font-size:15px}
.bar{display:flex;gap:8px;margin-top:12px}
.bar button{flex:1}
.saved{padding:10px;background:#29394f;border-radius:10px;margin:8px 0;font-size:13px;overflow-wrap:anywhere}
#editToolbar{display:none;position:absolute;z-index:8;left:9px;right:9px;bottom:10px;background:#142238f2;border:1px solid #526781;border-radius:15px;padding:8px;box-shadow:0 5px 24px #0008;backdrop-filter:blur(12px)}
#editToolbar .toolrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
#editToolbar button{border:1px solid #536780;border-radius:9px;background:#2b3e56;color:#fff;padding:9px 10px;font-size:12px;min-width:58px}
#editToolbar button.active{background:#2879ed;border-color:#2879ed}
#editToolbar .actions{display:flex;gap:8px;margin-top:8px}
#editToolbar .actions button{flex:1;font-weight:bold;padding:11px;font-size:14px}
.save{background:#247a4b!important;border-color:#247a4b!important}
.cancel{background:#a7353d!important;border-color:#a7353d!important}
.toolbarHint{text-align:center;font-size:11px;color:#d0d9e6;padding:4px 0 7px}
#toast{display:none;position:fixed;z-index:20;top:calc(65px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#101722;border:1px solid #50617a;padding:10px 13px;border-radius:10px;font-size:12px;max-width:90%;text-align:center;box-shadow:0 4px 20px #0008}
.busy{opacity:.65;pointer-events:none}
#map canvas{touch-action:none}
</style>
</head>
<body>

<header>
<b>🌍 Mapo 3D Studio</b>
<div>
<button class="btn alt" onclick="world()">العالم</button>
<button class="btn alt" onclick="tilt()">3D/2D</button>
</div>
</header>

<div id="mapwrap">
<div id="map"></div>

<div id="editToolbar">
 <div class="toolbarHint" id="toolbarHint">اضغط على أي مكان بالخريطة لنقل المبنى إليه، أو اسحبه من مركزه</div>
 <div class="toolrow">
  <button id="tbMove" class="active" onclick="setMode('move')">✥ تحريك</button>
  <button id="tbRotate" onclick="setMode('rotate')">↻ تدوير</button>
  <button onclick="scaleBy(-0.1)">－ حجم</button>
  <button onclick="scaleBy(0.1)">＋ حجم</button>
  <button onclick="turn(-15)">↶ 15°</button>
  <button onclick="turn(15)">↷ 15°</button>
  <button onclick="elevBy(-1)">خفض</button>
  <button onclick="elevBy(1)">رفع</button>
 </div>
 <div class="actions">
  <button class="save" onclick="saveDraft()">✓ حفظ</button>
  <button class="cancel" onclick="cancelModel()">✕ إلغاء</button>
 </div>
</div>
</div>

<footer>
<p class="hint">حدد الموقع على الخريطة، ارفع نموذج GLB، ثم عدّل مكانه وحجمه واتجاهه.</p>
<div class="coords" id="coords">لم يتم تحديد موقع</div>
<div class="row">
<button class="btn" onclick="menu()">خيارات الموقع</button>
<button class="btn" onclick="uploadOpen()">＋ رفع مبنى 3D</button>
<button class="btn alt" onclick="savedOpen()">العناصر المحفوظة</button>
</div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<div class="scrim" id="menuSheet" onclick="back(event,'menuSheet')">
<section class="sheet">
<h3>شنو تريد تسوي بهذا المكان؟</h3>
<p id="placeText"></p>
<div class="grid">
<button class="choice" onclick="uploadOpen()"><b>📦 رفع مبنى 3D</b><small>GLB</small></button>
<button class="choice" onclick="labelOpen()"><b>📍 إضافة تسمية</b><small>اسم للموقع</small></button>
<button class="choice" onclick="favorite()"><b>⭐ حفظ الموقع</b><small>إضافة للمفضلة</small></button>
<button class="choice" onclick="copyCoords()"><b>🧭 نسخ الإحداثيات</b><small>نسخ الموقع</small></button>
</div>
<div class="bar">
<button class="btn alt" onclick="close('menuSheet')">إغلاق</button>
</div>
</section>
</div>

<div class="scrim" id="uploadSheet" onclick="back(event,'uploadSheet')">
<section class="sheet">
<h3>رفع نموذج المبنى</h3>
<p>اختر ملف GLB. الحد الأقصى 250MB.</p>
<label class="field" for="file">ملف 3D</label>
<input id="file" type="file" accept=".glb,model/gltf-binary">
<label class="field" for="name">اسم المبنى</label>
<input id="name" placeholder="اسم المبنى">
<div class="bar">
<button class="btn" id="uploadBtn" onclick="loadModel()">رفع وعرض المبنى</button>
<button class="btn alt" onclick="close('uploadSheet')">رجوع</button>
</div>
</section>
</div>

<div class="scrim" id="savedSheet" onclick="back(event,'savedSheet')">
<section class="sheet">
<h3>العناصر المحفوظة</h3>
<div id="savedList"></div>
<button class="btn alt" onclick="close('savedSheet')">إغلاق</button>
</section>
</div>

<div class="scrim" id="labelSheet" onclick="back(event,'labelSheet')">
<section class="sheet">
<h3>إضافة تسمية</h3>
<input id="label" placeholder="اسم المكان">
<div class="bar">
<button class="btn" onclick="saveLabel()">حفظ</button>
<button class="btn alt" onclick="close('labelSheet')">رجوع</button>
</div>
</section>
</div>

<script>
'use strict';

const KEY='mapo_studio_glb_v2';
const DB='mapo_glb_files_v2';
const DEFAULT_FOOTPRINT_METERS=70;

let items=[];
try{
 items=JSON.parse(localStorage.getItem(KEY)||'[]');
 if(!Array.isArray(items))items=[];
}catch(e){items=[];}

let selected=null;
let root=null;
let scene=null;
let camera=null;
let renderer=null;
let anchor=null;
let blobId=null;
let modelName='';
let modelGroup=null;
let modelLayer=null;

let mode='move';
let dragState=null;
let justDragged=false;
let elevationMeters=0;
let originalState=null;
let isLoading=false;
let isExistingModel=false;
let editing=false;

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[0,18],
 zoom:1.55,
 antialias:true
});

map.addControl(new maplibregl.NavigationControl(),'top-right');

let rtlReady=false;

try{
 maplibregl.setRTLTextPlugin(
  'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',
  err=>{
   if(err)console.warn('RTL plugin:',err);
   else{
    rtlReady=true;
    applyArabicLabels();
   }
  },
  true
 );
}catch(err){
 console.warn('RTL plugin unavailable',err);
}

function applyArabicLabels(){
 if(!map.isStyleLoaded())return;

 for(const layer of map.getStyle().layers||[]){
  if(layer.type!=='symbol'||!layer.layout?.['text-field'])continue;

  try{
   map.setLayoutProperty(layer.id,'text-field',[
    'coalesce',
    ['get','name:ar'],
    ['get','name_ar'],
    ['get','name']
   ]);

   map.setLayoutProperty(layer.id,'text-justify','auto');
  }catch(e){
   console.warn('Arabic label',layer.id,e);
  }
 }
}

map.on('style.load',()=>{
 if(rtlReady)applyArabicLabels();
});

function msg(s,ms=3500){
 const e=document.getElementById('toast');
 e.textContent=s;
 e.style.display='block';
 clearTimeout(msg.t);
 msg.t=setTimeout(()=>e.style.display='none',ms);
}

function open(id){
 document.getElementById(id).style.display='flex';
}

function close(id){
 document.getElementById(id).style.display='none';
}

function back(e,id){
 if(e.target.id===id)close(id);
}

function saveMeta(){
 try{
  localStorage.setItem(KEY,JSON.stringify(items));
  return true;
 }catch(e){
  msg('تعذر حفظ البيانات: مساحة التخزين ممتلئة أو غير متاحة');
  return false;
 }
}

function fmt(p){
 return Number(p.lat).toFixed(5)+', '+Number(p.lng).toFixed(5);
}

function choose(ll,show=true){
 selected={lng:ll.lng,lat:ll.lat};
 document.getElementById('coords').textContent='الموقع: '+fmt(selected);
 document.getElementById('placeText').textContent='الإحداثيات: '+fmt(selected);
 if(show)open('menuSheet');
}

function menu(){
 if(root&&editing){
  msg('احفظ التعديل أو ألغِه أولاً');
  return;
 }

 if(!selected){
  msg('اضغط على الخريطة لتحديد الموقع أولاً');
  return;
 }

 open('menuSheet');
}

function world(){
 map.flyTo({center:[0,18],zoom:1.55,pitch:0,bearing:0});
}

function tilt(){
 map.easeTo({pitch:map.getPitch()>20?0:55});
}

function uploadOpen(){
 if(root&&editing){
  msg('أنهِ تعديل المبنى الحالي بالحفظ أو الإلغاء أولاً');
  return;
 }

 if(!selected){
  msg('حدد موقعاً على الخريطة أولاً');
  return;
 }

 close('menuSheet');
 open('uploadSheet');
}

function dbOpen(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB,1);

  request.onupgradeneeded=()=>{
   if(!request.result.objectStoreNames.contains('files')){
    request.result.createObjectStore('files',{keyPath:'id'});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('تعذر فتح قاعدة الملفات'));
 });
}

async function storeFile(id,blob){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');
  tx.objectStore('files').put({id,blob});

  tx.oncomplete=()=>{
   db.close();
   resolve();
  };

  tx.onerror=()=>{
   const err=tx.error;
   db.close();
   reject(err||new Error('فشل تخزين الملف'));
  };

  tx.onabort=()=>{
   const err=tx.error;
   db.close();
   reject(err||new Error('تم إلغاء التخزين'));
  };
 });
}

async function readFile(id){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readonly');
  const request=tx.objectStore('files').get(id);

  request.onsuccess=()=>{
   const blob=request.result?.blob;
   db.close();
   resolve(blob);
  };

  request.onerror=()=>{
   const err=request.error;
   db.close();
   reject(err||new Error('تعذر قراءة الملف'));
  };
 });
}

async function deleteStoredFile(id){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');
  tx.objectStore('files').delete(id);

  tx.oncomplete=()=>{
   db.close();
   resolve();
  };

  tx.onerror=()=>{
   const err=tx.error;
   db.close();
   reject(err);
  };
 });
}

function init3d(){
 if(scene)return;

 if(!window.THREE||!THREE.GLTFLoader){
  throw new Error('مكتبات Three.js لم يتم تحميلها. تحقق من الإنترنت ثم حدّث الصفحة.');
 }

 scene=new THREE.Scene();
 camera=new THREE.Camera();

 scene.add(new THREE.HemisphereLight(0xffffff,0x777777,1.7));

 const sun=new THREE.DirectionalLight(0xffffff,2.0);
 sun.position.set(-80,120,80);
 scene.add(sun);

 modelGroup=new THREE.Group();
 scene.add(modelGroup);

 modelLayer={
  id:'mapo-3d-model-layer',
  type:'custom',
  renderingMode:'3d',

  onAdd:function(m,gl){
   renderer=new THREE.WebGLRenderer({
    canvas:m.getCanvas(),
    context:gl,
    antialias:true
   });

   renderer.autoClear=false;
   renderer.outputColorSpace=THREE.SRGBColorSpace;
  },

  render:function(gl,matrix){
   if(!renderer||!root||!anchor)return;

   const mercator=maplibregl.MercatorCoordinate.fromLngLat(
    [anchor.lng,anchor.lat],
    elevationMeters
   );

   const meterScale=mercator.meterInMercatorCoordinateUnits();
   const mapMatrix=new THREE.Matrix4().fromArray(matrix);

   const translate=new THREE.Matrix4().makeTranslation(
    mercator.x,mercator.y,mercator.z
   );

   const rotate=new THREE.Matrix4().makeRotationX(Math.PI/2);

   const scale=new THREE.Matrix4().makeScale(
    meterScale,-meterScale,meterScale
   );

   // ترتيب التحويل المستخدم لربط Three.js بإحداثيات MapLibre.
   camera.projectionMatrix
    .copy(mapMatrix)
    .multiply(translate)
    .multiply(rotate)
    .multiply(scale);

   camera.projectionMatrixInverse
    .copy(camera.projectionMatrix)
    .invert();

   renderer.resetState();
   renderer.render(scene,camera);
  }
 };

 if(map.isStyleLoaded()){
  if(!map.getLayer(modelLayer.id)){
   map.addLayer(modelLayer);
  }
 }else{
  map.once('load',()=>{
   if(!map.getLayer(modelLayer.id)){
    map.addLayer(modelLayer);
   }
  });
 }
}

function requestRender(){
 if(map)map.triggerRepaint();
}

// توحيد وحدات النموذج ووضع قاعدته على الأرض.
function normalizeModel(object,targetMeters=DEFAULT_FOOTPRINT_METERS){
 object.updateMatrixWorld(true);

 let bounds=new THREE.Box3().setFromObject(object);

 if(bounds.isEmpty()){
  throw new Error('النموذج لا يحتوي على مجسمات ثلاثية الأبعاد ظاهرة');
 }

 const size=bounds.getSize(new THREE.Vector3());
 const horizontal=Math.max(size.x,size.z);

 if(!Number.isFinite(horizontal)||horizontal<0.000001){
  throw new Error('أبعاد النموذج غير صالحة');
 }

 const factor=targetMeters/horizontal;

 object.scale.multiplyScalar(factor);
 object.updateMatrixWorld(true);

 bounds=new THREE.Box3().setFromObject(object);

 const center=bounds.getCenter(new THREE.Vector3());

 object.position.x-=center.x;
 object.position.z-=center.z;
 object.position.y-=bounds.min.y;

 object.updateMatrixWorld(true);

 const wrapper=new THREE.Group();
 wrapper.add(object);

 return wrapper;
}

function setMode(next){
 mode=next;

 document.getElementById('tbMove').classList.toggle('active',mode==='move');
 document.getElementById('tbRotate').classList.toggle('active',mode==='rotate');

 document.getElementById('toolbarHint').textContent=
  mode==='move'
   ?'اضغط على أي مكان بالخريطة لنقل المبنى، أو اسحبه من مركزه'
   :'اسحب يميناً أو يساراً لتدوير المبنى';
}

function showToolbar(){
 document.getElementById('editToolbar').style.display='block';
}

function hideToolbar(){
 document.getElementById('editToolbar').style.display='none';
}

function elevBy(n){
 elevationMeters=Math.max(0,Math.min(100,elevationMeters+n));
 requestRender();
}

function turn(n){
 if(!root)return;
 root.rotation.y+=n*Math.PI/180;
 requestRender();
}

function scaleBy(n){
 if(!root)return;

 const next=Math.max(.1,Math.min(10,root.scale.x+n));
 root.scale.setScalar(next);

 requestRender();
}

function captureState(){
 if(!root||!anchor)return null;

 return{
  position:{...anchor},
  rotation:root.rotation.y,
  scale:root.scale.x,
  elevation:elevationMeters
 };
}

function restoreState(state){
 if(!state||!root)return;

 anchor={...state.position};
 root.rotation.y=state.rotation;
 root.scale.setScalar(state.scale);
 elevationMeters=state.elevation;

 requestRender();
}

function parseGLB(buffer){
 return new Promise((resolve,reject)=>{
  try{
   new THREE.GLTFLoader().parse(
    buffer,
    '',
    resolve,
    error=>reject(error||new Error('تعذر تحليل ملف GLB'))
   );
  }catch(error){
   reject(error);
  }
 });
}

async function loadModel(){
 if(isLoading)return;

 const file=document.getElementById('file').files?.[0];

 if(!file){
  msg('اختَر ملف GLB أولاً');
  return;
 }

 if(!file.name.toLowerCase().endsWith('.glb')){
  msg('الملف لازم يكون بصيغة GLB');
  return;
 }

 if(!selected){
  msg('حدد موقع المبنى على الخريطة أولاً');
  return;
 }

 if(!file.size){
  msg('الملف فارغ');
  return;
 }

 if(file.size>250*1024*1024){
  msg('حجم الملف أكبر من 250MB');
  return;
 }

 isLoading=true;

 const button=document.getElementById('uploadBtn');
 button.disabled=true;
 button.textContent='جاري التحميل...';

 document.getElementById('uploadSheet').classList.add('busy');
 msg('جاري قراءة ملف النموذج...',15000);

 let storedId=null;

 try{
  const buffer=await file.arrayBuffer();

  if(buffer.byteLength<12){
   throw new Error('الملف صغير أو غير مكتمل');
  }

  if(new DataView(buffer).getUint32(0,true)!==0x46546c67){
   throw new Error('محتوى الملف ليس GLB صالحاً');
  }

  init3d();

  const gltf=await parseGLB(buffer);

  if(!gltf||!gltf.scene){
   throw new Error('لم يتم العثور على مشهد داخل الملف');
  }

  const newRoot=normalizeModel(gltf.scene);

  storedId='glb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);

  await storeFile(
   storedId,
   new Blob([buffer],{type:'model/gltf-binary'})
  );

  if(root&&modelGroup){
   modelGroup.remove(root);
  }

  root=newRoot;
  modelGroup.add(root);

  anchor={...selected};
  blobId=storedId;

  modelName=document.getElementById('name').value.trim()||
   file.name.replace(/\.glb$/i,'');

  elevationMeters=0;
  isExistingModel=false;
  editing=true;
  originalState=captureState();

  setMode('move');

  close('uploadSheet');

  map.flyTo({
   center:[anchor.lng,anchor.lat],
   zoom:18,
   pitch:55,
   duration:900
  });

  showToolbar();
  requestRender();

  msg('تم تحميل النموذج. اضغط على أي مكان بالخريطة لنقله.');

 }catch(error){
  console.error('GLB load failed:',error);

  if(storedId){
   deleteStoredFile(storedId).catch(()=>{});
  }

  msg('فشل تحميل النموذج: '+(error?.message||String(error)),7000);

 }finally{
  isLoading=false;
  button.disabled=false;
  button.textContent='رفع وعرض المبنى';

  document.getElementById('uploadSheet').classList.remove('busy');
 }
}

function saveDraft(){
 if(!root||!anchor||!blobId){
  msg('ماكو نموذج مفتوح للحفظ');
  return;
 }

 const record={
  id:blobId,
  type:'model',
  name:modelName,
  fileId:blobId,
  lng:anchor.lng,
  lat:anchor.lat,
  rotation:root.rotation.y*180/Math.PI,
  scale:root.scale.x,
  elevation:elevationMeters,
  status:'draft'
 };

 const previous=items;

 items=items.filter(item=>item.id!==blobId);
 items.push(record);

 if(!saveMeta()){
  items=previous;
  return;
 }

 originalState=null;
 isExistingModel=true;
 editing=false;

 hideToolbar();
 requestRender();

 msg('تم حفظ المبنى محلياً وبقي ظاهراً على الخريطة');
}

function cancelModel(){
 if(!root)return;

 if(isExistingModel&&originalState){
  restoreState(originalState);
  editing=false;
  hideToolbar();

  msg('تم إلغاء التعديلات وإرجاع آخر نسخة محفوظة');
  return;
 }

 const id=blobId;

 if(modelGroup){
  modelGroup.remove(root);
 }

 root=null;
 anchor=null;
 blobId=null;
 modelName='';
 originalState=null;
 elevationMeters=0;
 isExistingModel=false;
 editing=false;

 hideToolbar();
 requestRender();

 if(id){
  deleteStoredFile(id).catch(console.warn);
 }

 msg('تم إلغاء النموذج');
}

function labelOpen(){
 close('menuSheet');
 open('labelSheet');
}

function saveLabel(){
 const name=document.getElementById('label').value.trim();

 if(!name||!selected)return;

 items.push({
  id:'label_'+Date.now(),
  type:'label',
  name,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 if(saveMeta()){
  close('labelSheet');
  msg('تم حفظ التسمية محلياً');
 }
}

function favorite(){
 if(!selected)return;

 const name=prompt('اسم الموقع','موقع محفوظ');

 if(name===null)return;

 items.push({
  id:'fav_'+Date.now(),
  type:'favorite',
  name,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 if(saveMeta()){
  close('menuSheet');
  msg('تم حفظ الموقع محلياً');
 }
}

function copyCoords(){
 if(!selected)return;

 const value=selected.lng+', '+selected.lat;

 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(value)
   .then(()=>msg('تم نسخ الإحداثيات'))
   .catch(()=>msg(value));
 }else{
  msg(value);
 }

 close('menuSheet');
}

function esc(value){
 return String(value).replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[char]));
}

function savedOpen(){
 const box=document.getElementById('savedList');

 box.innerHTML=items.length
  ?items.map(item=>`
   <div class="saved">
    <b>${esc(item.name)}</b><br>
    <small>${esc(item.type)} · ${esc(item.status||'draft')} · ${Number(item.lat).toFixed(5)}, ${Number(item.lng).toFixed(5)}</small><br>
    <button class="btn alt" onclick="focusItem('${esc(item.id)}')">عرض</button>
    <button class="btn alt" onclick="deleteItem('${esc(item.id)}')">حذف</button>
   </div>
  `).join('')
  :'<p>لا توجد عناصر محفوظة.</p>';

 open('savedSheet');
}

async function focusItem(id){
 const item=items.find(entry=>entry.id===id);

 if(!item)return;

 close('savedSheet');

 selected={lng:item.lng,lat:item.lat};

 document.getElementById('coords').textContent='الموقع: '+fmt(selected);

 map.flyTo({
  center:[item.lng,item.lat],
  zoom:18,
  pitch:50
 });

 if(item.type!=='model')return;

 try{
  const blob=await readFile(item.fileId);

  if(!blob){
   throw new Error('ملف النموذج غير موجود في تخزين هذا المتصفح');
  }

  const buffer=await blob.arrayBuffer();

  init3d();

  const gltf=await parseGLB(buffer);
  const loaded=normalizeModel(gltf.scene);

  if(root&&modelGroup){
   modelGroup.remove(root);
  }

  root=loaded;
  modelGroup.add(root);

  anchor={lng:item.lng,lat:item.lat};
  blobId=item.fileId;
  modelName=item.name;

  root.scale.setScalar(Number(item.scale)||1);
  root.rotation.y=(Number(item.rotation)||0)*Math.PI/180;

  elevationMeters=Number(item.elevation)||0;

  isExistingModel=true;
  editing=true;
  originalState=captureState();

  setMode('move');
  showToolbar();
  requestRender();

  msg('تم فتح المبنى المحفوظ');

 }catch(error){
  console.error(error);
  msg('تعذر فتح المبنى: '+(error.message||String(error)),6500);
 }
}

async function deleteItem(id){
 const item=items.find(entry=>entry.id===id);

 if(!item||!confirm('تأكيد الحذف؟'))return;

 items=items.filter(entry=>entry.id!==id);

 if(!saveMeta())return;

 if(item.fileId){
  try{
   await deleteStoredFile(item.fileId);
  }catch(error){
   console.warn(error);
  }
 }

 if(blobId===item.fileId){
  cancelModel();
 }

 savedOpen();
}

map.on('move',requestRender);
map.on('zoom',requestRender);
map.on('pitch',requestRender);
map.on('rotate',requestRender);

map.on('load',()=>{
 try{
  init3d();
  requestRender();
 }catch(error){
  console.error(error);
  msg(error.message);
 }
});

function canvasPoint(event){
 const rect=map.getCanvas().getBoundingClientRect();
 return[event.clientX-rect.left,event.clientY-rect.top];
}

const mapCanvas=map.getCanvas();

mapCanvas.addEventListener('pointerdown',event=>{
 if(!root||!anchor||!editing)return;

 if(event.pointerType==='mouse'&&event.button!==0)return;

 const point=canvasPoint(event);
 const modelPoint=map.project([anchor.lng,anchor.lat]);

 if(Math.hypot(point[0]-modelPoint.x,point[1]-modelPoint.y)>135)return;

 event.preventDefault();
 event.stopImmediatePropagation();

 map.dragPan.disable();

 try{
  mapCanvas.setPointerCapture(event.pointerId);
 }catch(error){}

 dragState={
  id:event.pointerId,
  x:event.clientX,
  y:event.clientY,
  rotation:root.rotation.y*180/Math.PI
 };
},{capture:true});

mapCanvas.addEventListener('pointermove',event=>{
 if(!dragState||dragState.id!==event.pointerId)return;

 event.preventDefault();
 event.stopImmediatePropagation();

 if(mode==='move'){
  const ll=map.unproject(canvasPoint(event));

  anchor={lng:ll.lng,lat:ll.lat};

  document.getElementById('coords').textContent='الموقع: '+fmt(anchor);

 }else if(mode==='rotate'){
  root.rotation.y=
   (dragState.rotation+(event.clientX-dragState.x)*0.7)*Math.PI/180;
 }

 requestRender();
},{capture:true});

function finishDrag(event){
 if(!dragState)return;

 event.preventDefault();
 event.stopImmediatePropagation();

 dragState=null;
 justDragged=true;

 map.dragPan.enable();
 requestRender();
}

mapCanvas.addEventListener('pointerup',finishDrag,{capture:true});
mapCanvas.addEventListener('pointercancel',finishDrag,{capture:true});

map.on('click',event=>{
 if(justDragged){
  justDragged=false;
  return;
 }

 const point=event.lngLat;

 if(root&&editing){
  if(mode==='move'){
   anchor={lng:point.lng,lat:point.lat};
   selected={...anchor};

   document.getElementById('coords').textContent='الموقع: '+fmt(anchor);

   requestRender();
   msg('تم نقل المبنى إلى الموقع الجديد');
  }

  return;
 }

 choose(point,false);
});

window.addEventListener('error',event=>{
 console.error('Page error:',event.error||event.message);

 if(isLoading){
  msg('حدث خطأ أثناء تحميل النموذج: '+(event.message||'خطأ غير معروف'),6500);
 }
});
</script>
