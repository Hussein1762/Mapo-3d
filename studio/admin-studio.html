
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Mapo 3D Studio</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
 --bg:#101722;
 --panel:#192536;
 --panel2:#26364b;
 --line:#3a4a60;
 --blue:#347ff0;
}

* {
 box-sizing:border-box;
}

html,body {
 height:100%;
 margin:0;
 overflow:hidden;
 background:var(--bg);
 color:#f5f7fb;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

body {
 display:flex;
 flex-direction:column;
}

header {
 height:60px;
 flex:none;
 background:var(--bg);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 13px;
 border-bottom:1px solid var(--line);
 z-index:2;
}

.brand {
 font-size:18px;
 font-weight:750;
}

.topbtn {
 background:var(--panel2);
 color:white;
 border:1px solid var(--line);
 border-radius:11px;
 padding:10px 13px;
 font:inherit;
}

#map {
 flex:1;
 min-height:180px;
 width:100%;
}

.maplibregl-ctrl-group {
 border-radius:12px!important;
 overflow:hidden;
}

footer {
 background:var(--bg);
 padding:10px 12px calc(12px + env(safe-area-inset-bottom));
 border-top:1px solid var(--line);
}

.hint {
 font-size:12px;
 color:#b5c0cf;
 line-height:1.5;
 margin:0 0 7px;
}

.coords {
 font-size:12px;
 color:#a9caff;
 direction:ltr;
 text-align:right;
 margin:0 0 8px;
}

.actions {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.action {
 padding:12px 7px;
 border:0;
 border-radius:12px;
 background:var(--blue);
 color:white;
 font:600 14px inherit;
}

.action.secondary {
 background:var(--panel2);
 border:1px solid var(--line);
}

.scrim {
 position:fixed;
 inset:0;
 background:#0009;
 z-index:10;
 display:none;
 align-items:flex-end;
}

.sheet {
 width:100%;
 max-height:82%;
 overflow:auto;
 background:#172232;
 border:1px solid var(--line);
 border-radius:22px 22px 0 0;
 padding:16px 15px calc(18px + env(safe-area-inset-bottom));
 box-shadow:0 -10px 35px #0007;
}

.handle {
 width:42px;
 height:4px;
 border-radius:8px;
 background:#718096;
 margin:-4px auto 14px;
}

.sheet h3 {
 margin:0 0 5px;
 font-size:19px;
}

.sheet p {
 color:#b5c0cf;
 font-size:13px;
 margin:0 0 13px;
}

.menu-grid {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.menu-item {
 background:var(--panel2);
 border:1px solid #40516a;
 color:white;
 border-radius:13px;
 padding:14px 10px;
 text-align:right;
 min-height:65px;
}

.menu-item b {
 display:block;
 font-size:14px;
 margin-bottom:5px;
}

.menu-item small {
 color:#c0cada;
 font-size:11px;
}

.field {
 display:block;
 margin:12px 0 5px;
 color:#c5d0df;
 font-size:13px;
}

input,select {
 width:100%;
 padding:13px;
 border-radius:11px;
 background:#101927;
 color:white;
 border:1px solid #45566f;
 font:inherit;
}

.formrow {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.sheet-buttons {
 display:flex;
 gap:8px;
 margin-top:15px;
}

.sheet-buttons button {
 flex:1;
 padding:13px;
 border:0;
 border-radius:11px;
 background:var(--blue);
 color:white;
 font-weight:650;
}

.sheet-buttons .cancel {
 background:#344256;
}

.marker-label {
 font-weight:700;
 color:white;
 background:#26364b;
 border:1px solid #8aa3c4;
 border-radius:8px;
 padding:5px 8px;
 white-space:nowrap;
}

#toast {
 position:fixed;
 top:70px;
 left:50%;
 transform:translateX(-50%);
 z-index:15;
 background:#101722ed;
 border:1px solid var(--line);
 padding:10px 14px;
 border-radius:12px;
 font-size:13px;
 display:none;
 max-width:90%;
 text-align:center;
}

@media(min-width:700px) {
 .sheet {
  max-width:560px;
  margin:0 auto 16px;
  border-radius:22px;
 }
 footer {
  padding-left:20%;
  padding-right:20%;
 }
}
</style>
</head>

<body>

<header>
 <div class="brand">🌍 Mapo 3D Studio</div>
 <div>
  <button class="topbtn" onclick="goWorld()">العالم</button>
  <button class="topbtn" onclick="toggleTilt()">3D / 2D</button>
 </div>
</header>

<div id="map"></div>

<footer>
 <p class="hint">
 اضغط ضغطة مطوّلة على أي مكان حتى تظهر قائمة الأوامر.
 اسحب بإصبعك لتحريك الخريطة، وبإصبعين للتكبير والدوران.
 </p>

 <div class="coords" id="coords">لم يتم تحديد موقع</div>

 <div class="actions">
  <button class="action" onclick="openMenu()">خيارات الموقع المحدد</button>
  <button class="action secondary" onclick="showSaved()">العناصر المحفوظة</button>
 </div>
</footer>

<div id="toast"></div>

<!-- قائمة خيارات الموقع -->
<div class="scrim" id="menuScrim" onclick="backdrop(event,'menuScrim')">
 <section class="sheet">
  <div class="handle"></div>

  <h3>شنو تريد تسوي بهذا المكان؟</h3>
  <p id="selectedInfo">حدد موقعاً على الخريطة</p>

  <div class="menu-grid">

   <button class="menu-item" onclick="buildingForm()">
    <b>🏢 إضافة مبنى 3D</b>
    <small>إنشاء مجسم ثلاثي الأبعاد</small>
   </button>

   <button class="menu-item" onclick="labelForm()">
    <b>📍 إضافة معلم أو تسمية</b>
    <small>اسم يظهر على الخريطة</small>
   </button>

   <button class="menu-item" onclick="favorite()">
    <b>⭐ حفظ الموقع</b>
    <small>إضافته إلى المواقع المحفوظة</small>
   </button>

   <button class="menu-item" onclick="copyCoords()">
    <b>🧭 نسخ الإحداثيات</b>
    <small>نسخ خط الطول والعرض</small>
   </button>

   <button class="menu-item" onclick="showSaved()">
    <b>🗂 إدارة العناصر</b>
    <small>عرض أو حذف العناصر</small>
   </button>

   <button class="menu-item" onclick="closeSheet('menuScrim')">
    <b>✕ إلغاء</b>
    <small>إغلاق القائمة</small>
   </button>

  </div>
 </section>
</div>

<!-- نموذج إضافة عنصر -->
<div class="scrim" id="formScrim" onclick="backdrop(event,'formScrim')">
 <section class="sheet">

  <div class="handle"></div>

  <h3 id="formTitle">إضافة عنصر</h3>
  <p id="formSub">أدخل معلومات العنصر</p>

  <label class="field">اسم العنصر</label>
  <input id="itemName" placeholder="مثلاً: مبنى أو معلم البصرة">

  <div id="buildingFields">

   <div class="formrow">
    <div>
     <label class="field">الارتفاع (متر)</label>
     <input id="itemHeight" type="number" min="3" max="500" value="30">
    </div>

    <div>
     <label class="field">عرض القاعدة (متر)</label>
     <input id="itemWidth" type="number" min="8" max="500" value="40">
    </div>
   </div>

   <label class="field">لون المبنى</label>

   <select id="itemColor">
    <option value="#438bd9">أزرق</option>
    <option value="#8b9baa">رمادي</option>
    <option value="#c49a62">رملي</option>
    <option value="#d7dce3">أبيض</option>
    <option value="#b96b55">طابوقي</option>
    <option value="#4e927b">أخضر</option>
   </select>

  </div>

  <div class="sheet-buttons">
   <button onclick="submitForm()">حفظ</button>
   <button class="cancel" onclick="closeSheet('formScrim')">رجوع</button>
  </div>

 </section>
</div>

<!-- العناصر المحفوظة -->
<div class="scrim" id="savedScrim" onclick="backdrop(event,'savedScrim')">
 <section class="sheet">

  <div class="handle"></div>

  <h3>العناصر المحفوظة</h3>
  <p>العناصر المخزونة على هذا الجهاز والمتصفح</p>

  <div id="savedList"></div>

  <div class="sheet-buttons">
   <button class="cancel" onclick="closeSheet('savedScrim')">إغلاق</button>
  </div>

 </section>
</div>

<script>
const KEY='mapo_studio_world_items_v2';

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[0,18],
 zoom:1.55,
 pitch:0,
 bearing:0
});

map.addControl(
 new maplibregl.NavigationControl({showCompass:true}),
 'top-right'
);

let selected=null;
let pressTimer=null;
let pressStart=null;
let longPressed=false;
let formType='building';
let items=loadItems();
let markers={};

function loadItems(){
 try {
  return JSON.parse(localStorage.getItem(KEY)||'[]');
 } catch(e) {
  return [];
 }
}

function persist(){
 localStorage.setItem(KEY,JSON.stringify(items));
}

function toast(s){
 let e=document.getElementById('toast');
 e.textContent=s;
 e.style.display='block';
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>e.style.display='none',2500);
}

function fmt(p){
 return p.lat.toFixed(5)+', '+p.lng.toFixed(5);
}

function selectPlace(ll,open){
 selected={lng:ll.lng,lat:ll.lat};

 document.getElementById('coords').textContent=
 'الموقع المحدد: '+fmt(selected);

 document.getElementById('selectedInfo').textContent=
 'الإحداثيات: '+fmt(selected);

 if(open)openSheet('menuScrim');
}

function openSheet(id){
 document.getElementById(id).style.display='flex';
}

function closeSheet(id){
 document.getElementById(id).style.display='none';
}

function backdrop(e,id){
 if(e.target.id===id)closeSheet(id);
}

function openMenu(){
 if(!selected){
  toast('اضغط مطولاً على مكان بالخريطة أولاً');
  return;
 }
 openSheet('menuScrim');
}

function goWorld(){
 map.flyTo({
  center:[0,18],
  zoom:1.55,
  pitch:0,
  bearing:0,
  duration:900
 });
}

function toggleTilt(){
 map.easeTo({
  pitch:map.getPitch()>20?0:58,
  duration:500
 });
}

function copyCoords(){
 if(!selected)return;

 let s=selected.lng.toFixed(6)+', '+selected.lat.toFixed(6);

 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(s)
  .then(()=>toast('تم نسخ الإحداثيات'))
  .catch(()=>toast(s));
 } else {
  toast(s);
 }

 closeSheet('menuScrim');
}

function favorite(){
 if(!selected)return;

 let n=prompt('اسم الموقع المحفوظ:','موقع محفوظ');

 if(n===null)return;

 items.push({
  id:String(Date.now()),
  type:'favorite',
  name:n||'موقع محفوظ',
  lng:selected.lng,
  lat:selected.lat
 });

 persist();
 renderItems();
 closeSheet('menuScrim');
 toast('تم حفظ الموقع');
}

function buildingForm(){
 formType='building';

 document.getElementById('formTitle').textContent='إضافة مبنى 3D';
 document.getElementById('formSub').textContent='حدد الاسم والارتفاع والعرض واللون';
 document.getElementById('buildingFields').style.display='block';
 document.getElementById('itemName').value='';

 closeSheet('menuScrim');
 openSheet('formScrim');
}

function labelForm(){
 formType='label';

 document.getElementById('formTitle').textContent='إضافة معلم أو تسمية';
 document.getElementById('formSub').textContent='سيظهر الاسم كعلامة على الخريطة';
 document.getElementById('buildingFields').style.display='none';
 document.getElementById('itemName').value='';

 closeSheet('menuScrim');
 openSheet('formScrim');
}

function submitForm(){
 if(!selected){
  toast('حدد موقعاً أولاً');
  return;
 }

 let n=document.getElementById('itemName').value.trim();

 if(!n){
  toast('اكتب اسم العنصر');
  return;
 }

 let x={
  id:String(Date.now())+Math.random(),
  type:formType,
  name:n,
  lng:selected.lng,
  lat:selected.lat
 };

 if(formType==='building'){
  x.height=Math.max(3,Math.min(500,
   Number(document.getElementById('itemHeight').value)||30));

  x.width=Math.max(8,Math.min(500,
   Number(document.getElementById('itemWidth').value)||40));

  x.color=document.getElementById('itemColor').value;
 }

 items.push(x);
 persist();
 renderItems();

 closeSheet('formScrim');
 toast('تمت إضافة '+n+' وحفظه على هذا الجهاز');
}

function square(lng,lat,w){
 let dy=w/111320;
 let dx=w/(111320*Math.max(.15,Math.cos(lat*Math.PI/180)));

 return [
  [lng-dx/2,lat-dy/2],
  [lng+dx/2,lat-dy/2],
  [lng+dx/2,lat+dy/2],
  [lng-dx/2,lat+dy/2],
  [lng-dx/2,lat-dy/2]
 ];
}

function renderItems(){

 let b=items.filter(x=>x.type==='building');

 let fc={
  type:'FeatureCollection',
  features:b.map(x=>({
   type:'Feature',
   properties:{
    height:x.height,
    color:x.color
   },
   geometry:{
    type:'Polygon',
    coordinates:[square(x.lng,x.lat,x.width)]
   }
  }))
 };

 if(!map.getSource('studio-buildings')){
  map.addSource('studio-buildings',{
   type:'geojson',
   data:fc
  });
 } else {
  map.getSource('studio-buildings').setData(fc);
 }

 if(!map.getLayer('studio-buildings-layer')){
  map.addLayer({
   id:'studio-buildings-layer',
   type:'fill-extrusion',
   source:'studio-buildings',
   paint:{
    'fill-extrusion-color':['get','color'],
    'fill-extrusion-height':['get','height'],
    'fill-extrusion-base':0,
    'fill-extrusion-opacity':.88
   }
  });
 }

 Object.values(markers).forEach(m=>m.remove());
 markers={};

 items.filter(x=>x.type!=='building').forEach(x=>{

  let el=document.createElement('div');
  el.className='marker-label';
  el.textContent=(x.type==='favorite'?'⭐ ':'📍 ')+x.name;

  markers[x.id]=new maplibregl.Marker({element:el})
   .setLngLat([x.lng,x.lat])
   .setPopup(new maplibregl.Popup().setText(x.name))
   .addTo(map);
 });
}

function showSaved(){

 closeSheet('menuScrim');

 let box=document.getElementById('savedList');

 if(!items.length){
  box.innerHTML='<p>لا توجد عناصر محفوظة حالياً.</p>';
 } else {

  box.innerHTML=items.map(x=>`
   <div style="background:#26364b;border:1px solid #40516a;border-radius:12px;padding:12px;margin:8px 0">
    <b>${safe(x.name)}</b>

    <div style="font-size:12px;color:#c0cada;margin:5px 0">
     ${x.type==='building'?'مبنى 3D':x.type==='label'?'معلم / تسمية':'موقع محفوظ'}
     · ${x.lat.toFixed(5)}, ${x.lng.toFixed(5)}
    </div>

    <button class="topbtn" onclick="flyItem('${x.id}')">عرض</button>
    <button class="topbtn" onclick="deleteItem('${x.id}')">حذف</button>
   </div>
  `).join('');
 }

 openSheet('savedScrim');
}

function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function flyItem(id){
 let x=items.find(a=>a.id===id);

 if(!x)return;

 closeSheet('savedScrim');

 selected={lng:x.lng,lat:x.lat};

 document.getElementById('coords').textContent=
 'الموقع المحدد: '+fmt(selected);

 map.flyTo({
  center:[x.lng,x.lat],
  zoom:17,
  pitch:55
 });
}

function deleteItem(id){

 if(!confirm('متأكد تريد تحذف هذا العنصر؟'))return;

 items=items.filter(x=>x.id!==id);

 persist();
 renderItems();
 showSaved();

 toast('تم الحذف');
}

map.on('load',()=>{
 renderItems();
 toast('الخريطة جاهزة — اضغط مطولاً لتحديد مكان');
});

// الضغط المطوّل على الخريطة
// تحريك الخريطة يلغي المؤقت حتى لا يتعارض مع السحب.

map.getCanvas().addEventListener('pointerdown',e=>{

 if(e.pointerType==='mouse'&&e.button!==0)return;

 longPressed=false;

 pressStart={
  x:e.clientX,
  y:e.clientY
 };

 clearTimeout(pressTimer);

 pressTimer=setTimeout(()=>{

  if(!pressStart)return;

  longPressed=true;

  let r=map.getCanvas().getBoundingClientRect();

  let ll=map.unproject([
   pressStart.x-r.left,
   pressStart.y-r.top
  ]);

  selectPlace(ll,true);

  if(navigator.vibrate)navigator.vibrate(35);

 },560);

},{passive:true});

map.getCanvas().addEventListener('pointermove',e=>{

 if(pressStart&&
 Math.hypot(
  e.clientX-pressStart.x,
  e.clientY-pressStart.y
 )>13){

  clearTimeout(pressTimer);
  pressStart=null;
 }

},{passive:true});

['pointerup','pointercancel','pointerleave'].forEach(ev=>{

 map.getCanvas().addEventListener(ev,()=>{
  clearTimeout(pressTimer);
  pressStart=null;
 },{passive:true});

});

map.on('click',e=>{

 if(longPressed){
  longPressed=false;
  return;
 }

 selectPlace(e.lngLat,false);

});

</script>
</body>
</html>
