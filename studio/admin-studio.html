<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#101722;color:#fff;font-family:Arial,sans-serif;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column}
@supports (height:100dvh){body{height:100dvh}}
header,footer{background:#101722;padding:11px 12px;border-color:#39485d;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #39485d;min-height:62px;padding-top:calc(11px + env(safe-area-inset-top))}

#mapwrap{position:relative;flex:1;min-height:150px}
#map{position:absolute;inset:0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:inherit}
.btn{background:#347ff0;color:#fff;border:0;border-radius:10px;padding:11px;margin:3px;font-size:14px}
.alt{background:#29384c}

.sheet h3{margin:0 0 8px}

<script>
'use strict';

const KEY='mapo_studio_glb_v2';
const LEGACY_KEY='mapo_studio_glb_v1';
const DB='mapo_glb_files_v2';
const LEGACY_DB='mapo_glb_files';
// وحدة glTF هي المتر، فيُعرض المبنى بحجمه الحقيقي (المقياس 1 = الحجم الأصلي للملف).
// لا نغيّر الحجم إلا إذا كانت الأبعاد غير معقولة (غالباً وحدات خاطئة: ملم/سم/بوصة)،
// وعندها نضبطه تلقائياً إلى AUTO_FIT_METERS ونُعلم المستخدم بذلك صراحة.
const MIN_REAL_METERS=3;             // أصغر من هذا (أفقياً) = غالباً الملف بوحدة خاطئة
const MAX_REAL_METERS=2500;          // أكبر من هذا = غالباً الملف بوحدة خاطئة
const AUTO_FIT_METERS=100;           // العرض المستهدف عند الضبط التلقائي فقط
const LEGACY_FOOTPRINT_METERS=70;    // سلوك النسخة القديمة (للعناصر المحفوظة سابقاً فقط)
const LEGACY_MAX_HEIGHT_METERS=300;
const MIN_ELEVATION=-50,MAX_ELEVATION=200;
const MAX_FILE_BYTES=250*1024*1024;
const SOFTEN_METALS=true;            // بدون خريطة بيئة تظهر المواد المعدنية سوداء/رمادية، فنخفف المعدنية

let items=[];
let needsMetaMigration=false;
try{
 const current=localStorage.getItem(KEY);
 const legacy=current===null?localStorage.getItem(LEGACY_KEY):null;
 items=JSON.parse(current!==null?current:(legacy||'[]'));
 if(!Array.isArray(items))items=[];
 needsMetaMigration=current===null&&legacy!==null;
}catch(e){items=[];}

// ---------------------------------------------------------------- الحالة
let selected=null;          // الموقع المحدد على الخريطة
let scene=null;
let camera=null;
let renderer=null;
let layerMap=null;
let modelLayer=null;
let gltfLoader=null;

// كل المباني الظاهرة على الخريطة: id -> entry
// entry = {id,name,fileId,group,anchor:{lng,lat},elevation,buffer,persisted}
const placed=new Map();
const loadingSaved=new Map();
let active=null;            // المبنى الذي يجري تعديله الآن
let editing=false;
let isNewModel=false;
let originalState=null;
let mode='move';
let drag=null;
let lastDragEnd=0;
let isLoading=false;
let isSaving=false;

const dbg=window.__mapoDebug={renderCalls:0,drawn:0,lastError:null,matrixSource:null};

// ---------------------------------------------------------------- الخريطة
if(!window.maplibregl){
 document.body.insertAdjacentHTML('afterbegin','<p style="padding:16px">تعذر تحميل مكتبة الخرائط. تحقق من الإنترنت ثم حدّث الصفحة.</p>');
 throw new Error('maplibregl missing');
}

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[0,18],
 zoom:1.55,
 canvasContextAttributes:{antialias:true}
});

map.addControl(new maplibregl.NavigationControl(),'top-right');

// MapLibre 5: الدالة ترجع Promise ولا تقبل callback.
try{
 const p=maplibregl.setRTLTextPlugin(
  'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',
  true
 );
 if(p&&p.catch)p.catch(err=>console.warn('RTL plugin:',err));
}catch(err){
 console.warn('RTL plugin unavailable',err);
}

function applyArabicLabels(){
 let layers;
 try{layers=map.getStyle().layers||[];}catch(e){return;}

 for(const layer of layers){
  if(layer.type!=='symbol'||!layer.layout||!layer.layout['text-field'])continue;

  try{
   map.setLayoutProperty(layer.id,'text-field',[
    'coalesce',
    ['get','name:ar'],
    ['get','name_ar'],
    ['get','name']
   ]);

   map.setLayoutProperty(layer.id,'text-justify','auto');
  }catch(e){
   console.warn('Arabic label',layer.id,e);
  }
 }
}

map.on('style.load',()=>{
 try{if(map.setProjection)map.setProjection({type:'mercator'});}catch(e){}
 applyArabicLabels();
 attachLayer();
});

function msg(s,ms=3500){
 const e=document.getElementById('toast');
 e.textContent=s;
 e.style.display='block';
 clearTimeout(msg.t);
 msg.t=setTimeout(()=>e.style.display='none',ms);
}

// ملاحظة: تم تغيير الاسمين open/close لأن close داخل onclick كان يُحلّ إلى document.close
// فلا تُغلق النوافذ أبداً عند الضغط على "إغلاق/رجوع".
function openSheet(id){
 document.getElementById(id).style.display='flex';
}

function closeSheet(id){
 document.getElementById(id).style.display='none';
}

function back(e,id){
 if(e.target.id===id)closeSheet(id);
}

function saveMeta(){
 try{
  localStorage.setItem(KEY,JSON.stringify(items));
  return true;
 }catch(e){
  msg('تعذر حفظ البيانات: مساحة التخزين ممتلئة أو غير متاحة');
  return false;
 }
}

function fmt(p){
 return Number(p.lat).toFixed(5)+', '+Number(p.lng).toFixed(5);
}

function choose(ll,show=true){
 selected={lng:ll.lng,lat:ll.lat};
 document.getElementById('coords').textContent='الموقع: '+fmt(selected);
 document.getElementById('placeText').textContent='الإحداثيات: '+fmt(selected);
 if(show)openSheet('menuSheet');
}

function menu(){
 if(editing){
  msg('احفظ التعديل أو ألغِه أولاً');
  return;
 }

 if(!selected){
  msg('اضغط على الخريطة لتحديد الموقع أولاً');
  return;
 }

 document.getElementById('placeText').textContent='الإحداثيات: '+fmt(selected);
 openSheet('menuSheet');
}

function world(){
 map.flyTo({center:[0,18],zoom:1.55,pitch:0,bearing:0});
}

function tilt(){
 map.easeTo({pitch:map.getPitch()>20?0:55});
}

function uploadOpen(){
 if(editing){
  msg('أنهِ تعديل المبنى الحالي بالحفظ أو الإلغاء أولاً');
  return;
 }

 if(!selected){
  msg('حدد موقعاً على الخريطة أولاً');
  return;
 }

 closeSheet('menuSheet');
 openSheet('uploadSheet');
}

// ---------------------------------------------------------------- IndexedDB
function dbOpen(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB){
   reject(new Error('التخزين المحلي (IndexedDB) غير متاح في هذا المتصفح'));
   return;
  }

  const request=indexedDB.open(DB,1);

  request.onupgradeneeded=()=>{
   if(!request.result.objectStoreNames.contains('files')){
    request.result.createObjectStore('files',{keyPath:'id'});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('تعذر فتح قاعدة الملفات'));
 });
}

async function storeFile(id,blob){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  let tx;

  try{
   tx=db.transaction('files','readwrite');
   tx.objectStore('files').put({id,blob});
  }catch(err){
   db.close();
   reject(err);
   return;
  }

  tx.oncomplete=()=>{
   db.close();
   resolve();
  };

  tx.onerror=()=>{
   const err=tx.error;
   db.close();
   reject(err||new Error('فشل تخزين الملف'));
  };

  tx.onabort=()=>{
   const err=tx.error;
   db.close();
   reject(err||new Error('تم إلغاء التخزين'));
  };
 });
}

async function readFile(id){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readonly');
  const request=tx.objectStore('files').get(id);

  request.onsuccess=()=>{
   const rec=request.result;
   db.close();
   resolve(rec?(rec.blob||rec.data):undefined);
  };

  request.onerror=()=>{
   const err=request.error;
   db.close();
   reject(err||new Error('تعذر قراءة الملف'));
  };
 });
}

// قراءة ملفات الإصدار السابق عند الحاجة، ثم نسخها إلى قاعدة v2 بعد نجاح القراءة.
async function readLegacyFile(id){
 if(!window.indexedDB)return undefined;

 return new Promise(resolve=>{
  let request;
  let created=false;

  try{request=indexedDB.open(LEGACY_DB);}catch(e){resolve(undefined);return;}

  request.onupgradeneeded=()=>{
   // لا ننشئ قاعدة قديمة فارغة إذا لم تكن موجودة أصلاً.
   created=true;
   try{request.transaction.abort();}catch(e){}
  };

  request.onerror=()=>{
   if(created){try{indexedDB.deleteDatabase(LEGACY_DB);}catch(e){}}
   resolve(undefined);
  };

  request.onsuccess=()=>{
   const db=request.result;

   if(!db.objectStoreNames.contains('files')){
    db.close();
    resolve(undefined);
    return;
   }

   let tx;

   try{tx=db.transaction('files','readonly');}
   catch(e){db.close();resolve(undefined);return;}

   const get=tx.objectStore('files').get(id);

   get.onsuccess=()=>{
    const rec=get.result;
    db.close();
    resolve(rec?(rec.blob||rec.data):undefined);
   };

   get.onerror=()=>{
    db.close();
    resolve(undefined);
   };
  };
 });
}

async function readFileWithMigration(id){
 let data=await readFile(id).catch(()=>undefined);

 if(data)return data;

 data=await readLegacyFile(id);

 if(data){
  try{await storeFile(id,data);}
  catch(error){console.warn('Legacy file copy failed',error);}
 }

 return data;
}

async function deleteStoredFile(id){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');
  tx.objectStore('files').delete(id);

  tx.oncomplete=()=>{
   db.close();
   resolve();
  };

  tx.onerror=()=>{
   const err=tx.error;
   db.close();
   reject(err);
  };
 });
}

async function listStoredFileIds(){
 const db=await dbOpen();

 return new Promise((resolve,reject)=>{
  const request=db.transaction('files','readonly').objectStore('files').getAllKeys();

  request.onsuccess=()=>{
   db.close();
   resolve(request.result||[]);
  };

  request.onerror=()=>{
   const err=request.error;
   db.close();
   reject(err);
  };
 });
}

// حذف ملفات GLB اليتيمة (التي رُفعت ثم أُغلقت الصفحة قبل الحفظ).
async function pruneOrphans(){
 try{
  const used=new Set(items.map(item=>item&&item.fileId).filter(Boolean));
  placed.forEach(entry=>used.add(entry.fileId));

  for(const key of await listStoredFileIds()){
   if(!used.has(key))await deleteStoredFile(key).catch(()=>{});
  }
 }catch(error){
  console.warn('prune',error);
 }
}

function toArrayBuffer(data){
 if(data instanceof ArrayBuffer)return Promise.resolve(data);
 if(data&&typeof data.arrayBuffer==='function')return data.arrayBuffer();

 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error||new Error('تعذر قراءة الملف'));
  reader.readAsArrayBuffer(data);
 });
}

// ---------------------------------------------------------------- Three.js داخل MapLibre
function ensureRenderer(gl){
 if(renderer&&renderer.getContext()===gl)return true;

 try{
  if(renderer){
   try{renderer.dispose();}catch(e){}
   renderer=null;
  }

  renderer=new THREE.WebGLRenderer({
   canvas:layerMap.getCanvas(),
   context:gl,
   antialias:true
  });

  renderer.autoClear=false;

  // الإصدار 0.146 يستخدم outputEncoding (الاسم outputColorSpace ظهر في r152 فقط).
  renderer.outputEncoding=THREE.sRGBEncoding;

  return true;
 }catch(error){
  dbg.lastError=String(error&&error.message||error);
  console.error('Three renderer',error);
  renderer=null;
  return false;
 }
}

// MapLibre 5 يمرر كائناً (CustomRenderMethodInput) وليس مصفوفة.
function projectionMatrixFrom(args){
 if(args&&args.defaultProjectionData&&args.defaultProjectionData.mainMatrix){
  dbg.matrixSource='defaultProjectionData.mainMatrix';
  return args.defaultProjectionData.mainMatrix;
 }

 if(args&&args.modelViewProjectionMatrix){
  dbg.matrixSource='modelViewProjectionMatrix';
  return args.modelViewProjectionMatrix;
 }

 if(args&&args.length===16){
  dbg.matrixSource='array';
  return args;
 }

 return null;
}

function handleContextLost(event){
 // MapLibre owns the shared context; preventDefault allows the browser to restore it.
 if(event&&event.preventDefault)event.preventDefault();
 renderer=null;
 dbg.lastError='WebGL context lost; waiting for restoration';
}

function handleContextRestored(){
 // Force Three.js to create a fresh renderer wrapper on the restored shared context.
 renderer=null;
 dbg.lastError=null;
 requestRender();
}

function init3d(){
 if(scene)return;

 if(!window.THREE||!THREE.GLTFLoader){
  throw new Error('مكتبات Three.js لم يتم تحميلها. تحقق من الإنترنت ثم حدّث الصفحة.');
 }

 // نبني المشهد بمتغيرات محلية ثم نعيّنه في النهاية، حتى لا يبقى init3d نصف مكتمل إذا فشل.
 const newScene=new THREE.Scene();
 const newCamera=new THREE.Camera();

 // المحرك الحالي (r146) يستخدم الإضاءة التقليدية: شدة 1 تعطي لون المادة تقريباً.
 // القيم السابقة (1.7 و 2.0) كانت تحرق الألوان وتجعل المبنى رمادياً مسطحاً.
 newScene.add(new THREE.HemisphereLight(0xffffff,0x8a909b,0.85));

 const sun=new THREE.DirectionalLight(0xffffff,0.9);
 sun.position.set(-80,120,80);
 newScene.add(sun);

 const fill=new THREE.DirectionalLight(0xdfe8ff,0.3);
 fill.position.set(90,50,-70);
 newScene.add(fill);

 // دوران يحوّل محور Y (الأعلى في glTF) إلى محور Z (الارتفاع في Mercator).
 const rotateX=new THREE.Matrix4().makeRotationX(Math.PI/2);

 modelLayer={
  id:'mapo-3d-model-layer',
  type:'custom',
  renderingMode:'3d',

  onAdd:function(m,gl){
   layerMap=m;

   const canvas=m.getCanvas();

   canvas.addEventListener('webglcontextlost',handleContextLost,false);
   canvas.addEventListener('webglcontextrestored',handleContextRestored,false);

   ensureRenderer(gl);
  },

  onRemove:function(m,gl){
   const canvas=m&&m.getCanvas?m.getCanvas():null;

   if(canvas){
    canvas.removeEventListener('webglcontextlost',handleContextLost,false);
    canvas.removeEventListener('webglcontextrestored',handleContextRestored,false);
   }

   if(renderer){
    try{renderer.dispose();}catch(e){}
    renderer=null;
   }

   layerMap=null;
  },

  render:function(gl,args){
   dbg.renderCalls++;

   if(!scene||!placed.size||!layerMap)return;
   if(!ensureRenderer(gl))return;

   const raw=projectionMatrixFrom(args);

   if(!raw||!Number.isFinite(raw[0])||!Number.isFinite(raw[5])){
    dbg.lastError='لم يتم استلام مصفوفة إسقاط صالحة من MapLibre';
    return;
   }

   const mapMatrix=new THREE.Matrix4().fromArray(raw);

   // لا نغيّر pixelRatio أو viewport هنا: MapLibre يملك الـ canvas والـ viewport.
   // استدعاء setPixelRatio/setViewport من داخل custom layer قد يغيّر أبعاد canvas
   // المشترك ويكسر رسم الخريطة، خصوصاً على Safari وواجهات Retina.
   placed.forEach(entry=>{entry.group.visible=false;});

   try{
    placed.forEach(entry=>{
     const mercator=maplibregl.MercatorCoordinate.fromLngLat(
      [entry.anchor.lng,entry.anchor.lat],
      entry.elevation
     );

     const s=mercator.meterInMercatorCoordinateUnits();

     // نفس تحويل MapLibre الرسمي: translate * scale(s,-s,s) * rotateX(90°).
     const local=new THREE.Matrix4()
      .makeTranslation(mercator.x,mercator.y,mercator.z)
      .scale(new THREE.Vector3(s,-s,s))
      .multiply(rotateX);

     camera.projectionMatrix.copy(mapMatrix).multiply(local);
     camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
     camera.matrixWorld.identity();
     camera.matrixWorldInverse.identity();

     entry.group.visible=true;

     renderer.resetState();
     renderer.render(scene,camera);
     renderer.resetState();

     entry.group.visible=false;
     dbg.drawn++;
    });
   }finally{
    placed.forEach(entry=>{entry.group.visible=true;});
   }
  }
 };

 scene=newScene;
 camera=newCamera;

 attachLayer();
}

function attachLayer(){
 if(!modelLayer)return;

 try{
  if(!map.getLayer(modelLayer.id))map.addLayer(modelLayer);
 }catch(error){
  map.once('load',attachLayer);
 }
}

function requestRender(){
 if(map)map.triggerRepaint();
}

function getLoader(){
 if(gltfLoader)return gltfLoader;

 const loader=new THREE.GLTFLoader();

 try{
  if(THREE.DRACOLoader){
   const draco=new THREE.DRACOLoader();
   draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
   loader.setDRACOLoader(draco);
  }
 }catch(e){console.warn('Draco',e);}

 try{
  if(window.MeshoptDecoder)loader.setMeshoptDecoder(window.MeshoptDecoder);
 }catch(e){console.warn('Meshopt',e);}

 gltfLoader=loader;
 return loader;
}

function parseGLB(buffer){
 return new Promise((resolve,reject)=>{
  try{
   getLoader().parse(
    buffer,
    '',
    resolve,
    error=>reject(error&&error.message?error:new Error('تعذر تحليل ملف GLB'))
   );
  }catch(error){
   reject(error);
  }
 });
}

// تنظيف النموذج: إزالة الأضواء/الكاميرات المضمنة وتعطيل frustum culling وتخفيف المواد المعدنية.
function prepareModel(object){
 const extras=[];

 object.traverse(node=>{
  if(node.isLight||node.isCamera)extras.push(node);
 });

 extras.forEach(node=>{if(node.parent)node.parent.remove(node);});

 object.traverse(node=>{
  if(!(node.isMesh||node.isPoints||node.isLine))return;

  node.frustumCulled=false;

  const list=Array.isArray(node.material)?node.material:[node.material];

  list.forEach(material=>{
   if(!material)return;

   if(SOFTEN_METALS&&material.isMeshStandardMaterial&&!material.metalnessMap&&!material.envMap&&material.metalness>0.35){
    material.metalness=0.35;
   }
  });
 });
}

// ضبط موضع النموذج: مركزه الأفقي عند نقطة الإحداثيات وأدنى نقطة فيه على الأرض.
// الحجم الحقيقي يبقى كما هو (المقياس 1) إلا عند الحاجة (انظر الثوابت أعلاه).
// نحسب الحدود بعد تطبيق تحويلات جذر glTF، لذلك يجب تطبيق الإزاحة على wrapper
// ذي المحاور المحلية المطابقة لإحداثيات الحدود، لا على object.position المحلي.
function normalizeModel(object,legacy=false){
 prepareModel(object);

 const wrapper=new THREE.Group();
 wrapper.add(object);
 wrapper.updateMatrixWorld(true);

 let bounds=new THREE.Box3().setFromObject(wrapper,true);

 if(bounds.isEmpty()){
  throw new Error('النموذج لا يحتوي على مجسمات ثلاثية الأبعاد ظاهرة');
 }

 const size=bounds.getSize(new THREE.Vector3());
 const horizontal=Math.max(size.x,size.z);

 if(!Number.isFinite(horizontal)||horizontal<0.000001||!Number.isFinite(size.y)){
  throw new Error('أبعاد النموذج غير صالحة');
 }

 let factor=1;
 let autoFitted=false;

 if(legacy){
  factor=LEGACY_FOOTPRINT_METERS/horizontal;
  if(size.y>0.000001)factor=Math.min(factor,LEGACY_MAX_HEIGHT_METERS/size.y);
 }else if(horizontal<MIN_REAL_METERS||horizontal>MAX_REAL_METERS){
  factor=AUTO_FIT_METERS/horizontal;
  autoFitted=true;
 }

 if(factor!==1){
  object.scale.multiplyScalar(factor);
  wrapper.updateMatrixWorld(true);
  bounds=new THREE.Box3().setFromObject(wrapper,true);
 }

 const center=bounds.getCenter(new THREE.Vector3());

 wrapper.position.x-=center.x;
 wrapper.position.z-=center.z;
 wrapper.position.y-=bounds.min.y;

 wrapper.updateMatrixWorld(true);

 // تحقق: المركز الأفقي عند 0 والقاعدة عند 0.
 const check=new THREE.Box3().setFromObject(wrapper,true);
 const cc=check.getCenter(new THREE.Vector3());
 const tol=Math.max(0.001,horizontal*factor*1e-4);

 if(Math.abs(cc.x)>tol||Math.abs(cc.z)>tol||Math.abs(check.min.y)>tol){
  console.warn('normalizeModel: centering drift',cc,check.min);
 }

 const finalSize=check.getSize(new THREE.Vector3());

 return{
  group:wrapper,
  factor,
  autoFitted,
  size:{x:finalSize.x,y:finalSize.y,z:finalSize.z},
  radius:Math.max(finalSize.x,finalSize.z)/2
 };
}
function disposeObject(object){
 object.traverse(node=>{
  if(node.geometry&&node.geometry.dispose)node.geometry.dispose();

  const list=Array.isArray(node.material)?node.material:[node.material];

  list.forEach(material=>{
   if(!material)return;

   Object.keys(material).forEach(key=>{
    const value=material[key];
    if(value&&value.isTexture)value.dispose();
   });

   if(material.dispose)material.dispose();
  });
 });
}

function createEntry(opts){
 const legacy=!!opts.legacy;
 const norm=normalizeModel(opts.object,legacy);
 const group=norm.group;

 group.rotation.y=opts.rotationY||0;
 group.scale.setScalar(opts.scale||1);

 scene.add(group);

 const entry={
  id:opts.id,
  name:opts.name,
  fileId:opts.fileId,
  group,
  anchor:{lng:opts.anchor.lng,lat:opts.anchor.lat},
  elevation:opts.elevation||0,
  buffer:null,
  persisted:false,
  legacy,
  radius:norm.radius,
  size:norm.size,
  autoFitted:norm.autoFitted,
  factor:norm.factor
 };

 placed.set(entry.id,entry);
 attachLayer();
 requestRender();

 return entry;
}

function removeEntry(entry){
 if(scene)scene.remove(entry.group);
 disposeObject(entry.group);
 placed.delete(entry.id);
 entry.buffer=null;
 requestRender();
}

// ---------------------------------------------------------------- أدوات التحرير
function setMode(next){
 mode=next;

 document.getElementById('tbMove').classList.toggle('active',mode==='move');
 document.getElementById('tbRotate').classList.toggle('active',mode==='rotate');

 document.getElementById('toolbarHint').textContent=
  mode==='move'
   ?'اضغط على أي مكان بالخريطة لنقل المبنى، أو اسحبه من مركزه'
   :'اسحب يميناً أو يساراً لتدوير المبنى';
}

function showToolbar(){
 document.getElementById('editToolbar').style.display='block';
}

function hideToolbar(){
 document.getElementById('editToolbar').style.display='none';
}

function snapshot(entry){
 return{
  anchor:{...entry.anchor},
  rotation:entry.group.rotation.y,
  scale:entry.group.scale.x,
  elevation:entry.elevation
 };
}

function startEditing(entry,fresh){
 active=entry;
 isNewModel=fresh;
 editing=true;
 drag=null;
 originalState=snapshot(entry);

 selected={...entry.anchor};
 document.getElementById('coords').textContent='الموقع: '+fmt(entry.anchor);

 setMode('move');
 showToolbar();
 requestRender();
}

function stopEditing(){
 active=null;
 editing=false;
 isNewModel=false;
 originalState=null;
 drag=null;

 hideToolbar();
 requestRender();
}

function elevBy(n){
 if(!active)return;

 active.elevation=Math.max(MIN_ELEVATION,Math.min(MAX_ELEVATION,active.elevation+n));

 requestRender();
}

// الزر "↷" يدير المبنى باتجاه عقارب الساعة (مشاهدة من الأعلى).
function turn(n){
 if(!active)return;

 active.group.rotation.y-=n*Math.PI/180;

 requestRender();
}

function scaleBy(n){
 if(!active)return;

 const next=Math.max(0.05,Math.min(20,active.group.scale.x*Math.exp(n)));

 active.group.scale.setScalar(next);

 requestRender();
}

// ---------------------------------------------------------------- رفع النموذج
async function loadModel(){
 if(isLoading)return;

 const file=document.getElementById('file').files&&document.getElementById('file').files[0];

 if(!file){
  msg('اختَر ملف GLB أولاً');
  return;
 }

 if(!file.name.toLowerCase().endsWith('.glb')){
  msg('الملف لازم يكون بصيغة GLB');
  return;
 }

 if(!selected){
  msg('حدد موقع المبنى على الخريطة أولاً');
  return;
 }

 if(editing){
  msg('أنهِ تعديل المبنى الحالي بالحفظ أو الإلغاء أولاً');
  return;
 }

 if(!file.size){
  msg('الملف فارغ');
  return;
 }

 if(file.size>MAX_FILE_BYTES){
  msg('حجم الملف أكبر من 250MB');
  return;
 }

 isLoading=true;

 const button=document.getElementById('uploadBtn');
 button.disabled=true;
 button.textContent='جاري التحميل...';

 document.getElementById('uploadSheet').classList.add('busy');
 msg('جاري قراءة ملف النموذج...',15000);

 try{
  const buffer=await toArrayBuffer(file);

  if(buffer.byteLength<12){
   throw new Error('الملف صغير أو غير مكتمل');
  }

  if(new DataView(buffer).getUint32(0,true)!==0x46546c67){
   throw new Error('محتوى الملف ليس GLB صالحاً');
  }

  init3d();

  const gltf=await parseGLB(buffer);

  if(!gltf||!gltf.scene){
   throw new Error('لم يتم العثور على مشهد داخل الملف');
  }

  const id='glb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);

  const entry=createEntry({
   id,
   name:document.getElementById('name').value.trim()||file.name.replace(/\.glb$/i,''),
   fileId:id,
   object:gltf.scene,
   anchor:selected,
   elevation:0,
   rotationY:0,
   scale:1
  });

  // تخزين الملف: فشل التخزين لا يمنع العرض، ويُعاد المحاولة عند الضغط على "حفظ".
  try{
   await storeFile(id,new Blob([buffer],{type:'model/gltf-binary'}));
   entry.persisted=true;
  }catch(storeError){
   console.warn('store failed',storeError);
   entry.buffer=buffer;
  }

  startEditing(entry,true);

  closeSheet('uploadSheet');

  map.flyTo({
   center:[entry.anchor.lng,entry.anchor.lat],
   zoom:18,
   pitch:55,
   duration:900
  });

  const dims=Math.round(entry.size.x)+'×'+Math.round(entry.size.z)+'×'+Math.round(entry.size.y)+' م';

  if(entry.autoFitted){
   msg('أبعاد الملف غير معقولة كأمتار، فتم ضبط الحجم تلقائياً إلى '+dims+'. استخدم ± حجم للتعديل.',9000);
  }else if(!entry.persisted){
   msg('تم تحميل النموذج ('+dims+') لكن تعذر تخزين الملف بعد. سنحاول مرة أخرى عند الحفظ.',6000);
  }else{
   msg('تم تحميل النموذج بحجمه الحقيقي ('+dims+'). اضغط على الخريطة لنقله.',5000);
  }

 }catch(error){
  console.error('GLB load failed:',error);
  dbg.lastError=String(error&&error.message||error);

  msg('فشل تحميل النموذج: '+(error&&error.message||String(error)),7000);

 }finally{
  isLoading=false;
  button.disabled=false;
  button.textContent='رفع وعرض المبنى';

  document.getElementById('uploadSheet').classList.remove('busy');
 }
}

// ---------------------------------------------------------------- الحفظ والإلغاء
async function saveDraft(){
 if(!active){
  msg('ماكو نموذج مفتوح للحفظ');
  return;
 }

 if(isSaving)return;
 isSaving=true;

 try{
  const entry=active;

  if(!entry.persisted){
   if(!entry.buffer){
    msg('ملف النموذج غير محفوظ في المتصفح. ارفعه من جديد.');
    return;
   }

   try{
    await storeFile(entry.fileId,new Blob([entry.buffer],{type:'model/gltf-binary'}));
    entry.persisted=true;
    entry.buffer=null;
   }catch(error){
    console.warn(error);
    msg('تعذر تخزين ملف النموذج على هذا الجهاز: '+(error&&error.message||String(error)),6500);
    return;
   }
  }

  const record={
   id:entry.id,
   type:'model',
   name:entry.name,
   fileId:entry.fileId,
   lng:entry.anchor.lng,
   lat:entry.anchor.lat,
   rotation:entry.group.rotation.y*180/Math.PI,
   scale:entry.group.scale.x,
   elevation:entry.elevation,
   v:entry.legacy?2:3,
   status:'draft'
  };

  const previous=items;

  items=items.filter(item=>item.id!==entry.id);
  items.push(record);

  if(!saveMeta()){
   items=previous;
   return;
  }

  try{
   if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){}

  stopEditing();

  msg('تم حفظ المبنى محلياً وبقي ظاهراً على الخريطة');

 }finally{
  isSaving=false;
 }
}

function cancelModel(){
 if(!active)return;

 const entry=active;

 if(!isNewModel){
  const state=originalState;

  if(state){
   entry.anchor={...state.anchor};
   entry.group.rotation.y=state.rotation;
   entry.group.scale.setScalar(state.scale);
   entry.elevation=state.elevation;
  }

  stopEditing();
  msg('تم إلغاء التعديلات وإرجاع آخر نسخة محفوظة');
  return;
 }

 removeEntry(entry);
 stopEditing();

 deleteStoredFile(entry.fileId).catch(console.warn);

 msg('تم إلغاء النموذج');
}

}

function saveLabel(){
 const name=document.getElementById('label').value.trim();

 if(!name||!selected)return;

  status:'draft'

function favorite(){

 const name=prompt('اسم الموقع','موقع محفوظ');

 if(name===null)return;

 items.push({
  id:'fav_'+Date.now(),
  type:'favorite',
  name,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

}

function copyCoords(){
 if(!selected)return;

 const value=selected.lng+', '+selected.lat;

 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(value)
   .then(()=>msg('تم نسخ الإحداثيات'))
   .catch(()=>msg(value));
 }else{
  msg(value);
 }

 closeSheet('menuSheet');
}

function esc(value){
 return String(value).replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[char]));
}

// ---------------------------------------------------------------- العناصر المحفوظة
function savedOpen(){
 const box=document.getElementById('savedList');

 box.innerHTML=items.length
  ?items.map(item=>`
   <div class="saved">
    <b>${esc(item.name)}</b><br>
    <small>${esc(item.type)} · ${esc(item.status||'draft')} · ${Number(item.lat).toFixed(5)}, ${Number(item.lng).toFixed(5)}</small><br>
    <button class="btn alt" onclick="focusItem('${esc(item.id)}')">عرض</button>
    <button class="btn alt" onclick="deleteItem('${esc(item.id)}')">حذف</button>
   </div>
  `).join('')
  :'<p>لا توجد عناصر محفوظة.</p>';

 openSheet('savedSheet');
}

// تحميل مبنى محفوظ من IndexedDB وعرضه (إن لم يكن معروضاً).
function loadSavedEntry(item){
 if(placed.has(item.id))return Promise.resolve(placed.get(item.id));
 if(loadingSaved.has(item.id))return loadingSaved.get(item.id);

 const promise=(async()=>{
  const stored=await readFileWithMigration(item.fileId);

  if(!stored){
   throw new Error('ملف النموذج غير موجود في تخزين هذا المتصفح');
  }

  const buffer=await toArrayBuffer(stored);

  init3d();

  const gltf=await parseGLB(buffer);

  if(!gltf||!gltf.scene){
   throw new Error('لم يتم العثور على مشهد داخل الملف');
  }

  const entry=createEntry({
   id:item.id,
   name:item.name,
   fileId:item.fileId,
   object:gltf.scene,
   anchor:{lng:Number(item.lng),lat:Number(item.lat)},
   elevation:Number(item.elevation)||0,
   rotationY:(Number(item.rotation)||0)*Math.PI/180,
   scale:Number(item.scale)||1,
   legacy:item.v!==3
  });

  entry.persisted=true;
  return entry;
 })();

 loadingSaved.set(item.id,promise);

 const clear=()=>loadingSaved.delete(item.id);
 promise.then(clear,clear);

 return promise;
}

async function focusItem(id){
 const item=items.find(entry=>entry.id===id);

 if(!item)return;

 if(editing&&!(active&&active.id===id)){
  msg('احفظ التعديل أو ألغِه أولاً');
  return;
 }

 closeSheet('savedSheet');

 selected={lng:item.lng,lat:item.lat};

 document.getElementById('coords').textContent='الموقع: '+fmt(selected);

 map.flyTo({
  center:[item.lng,item.lat],
  zoom:18,
  pitch:50
 });

 if(item.type!=='model')return;

 try{
  const entry=await loadSavedEntry(item);

  if(editing&&active===entry)return;

  if(editing){
   msg('احفظ التعديل أو ألغِه أولاً');
   return;
  }

  startEditing(entry,false);
  msg('تم فتح المبنى المحفوظ');

 }catch(error){
  console.error(error);
  dbg.lastError=String(error&&error.message||error);
  msg('تعذر فتح المبنى: '+(error.message||String(error)),6500);
 }
}

async function deleteItem(id){
 const item=items.find(entry=>entry.id===id);

 if(!item||!confirm('تأكيد الحذف؟'))return;

 const previous=items;

 items=items.filter(entry=>entry.id!==id);

 if(!saveMeta()){
  items=previous;
  return;
 }

 const entry=placed.get(id);

 if(entry){
  if(active===entry)stopEditing();
  removeEntry(entry);
 }

 if(item.fileId){
  try{
   await deleteStoredFile(item.fileId);
  }catch(error){
   console.warn(error);
  }
 }

 savedOpen();
}

// ---------------------------------------------------------------- أحداث الخريطة
map.on('move',requestRender);
map.on('zoom',requestRender);
map.on('pitch',requestRender);
map.on('rotate',requestRender);

async function restoreSaved(){
 if(needsMetaMigration){
  if(saveMeta())needsMetaMigration=false;
 }

 const models=items.filter(item=>item&&item.type==='model'&&item.fileId);

 if(!models.length)return;

 let failed=0;

 for(const item of models){
  try{
   await loadSavedEntry(item);
  }catch(error){
   failed++;
   console.warn('restore',item.id,error);
  }
 }

 if(failed)msg('تعذر عرض '+failed+' من المباني المحفوظة (الملف غير موجود في هذا المتصفح)',6000);

 pruneOrphans();
}

map.on('load',()=>{
 try{
  init3d();
  requestRender();
  restoreSaved();
 }catch(error){
  console.error(error);
  msg(error.message);
 }
});

// نصف قطر منطقة اللمس حول المبنى بالبكسل (يتغير مع التكبير وحجم المبنى).
function hitRadius(entry){
 try{
  const a=entry.anchor;
  const halfMeters=Math.max(5,(entry.radius||35)*entry.group.scale.x);
  const dLng=halfMeters/(111320*Math.max(0.05,Math.cos(a.lat*Math.PI/180)));

  const p0=map.project([a.lng,a.lat]);
  const p1=map.project([a.lng+dLng,a.lat]);

  return Math.min(160,Math.max(48,Math.hypot(p1.x-p0.x,p1.y-p0.y)*1.2));
 }catch(error){
  return 90;
 }
}

// السحب عبر أحداث MapLibre نفسها: e.preventDefault() يعطّل تحريك الخريطة
// (يعمل مع touchstart على iPhone، بينما pointerdown لا يوقف أحداث اللمس).
function startDrag(e){
 if(!editing||!active)return;

 if(e.type==='mousedown'&&e.originalEvent&&e.originalEvent.button!==0)return;
 if(e.points&&e.points.length>1)return;

 const center=map.project([active.anchor.lng,active.anchor.lat]);

 if(Math.hypot(e.point.x-center.x,e.point.y-center.y)>hitRadius(active))return;

 e.preventDefault();

 drag={
  startX:e.point.x,
  startY:e.point.y,
  offX:center.x-e.point.x,
  offY:center.y-e.point.y,
  rotation:active.group.rotation.y
 };

 try{map.dragPan.disable();}catch(err){}
}

function moveDrag(e){
 if(!drag||!active)return;

 if(e.points&&e.points.length>1){
  endDrag();
  return;
 }

 if(mode==='move'){
  const ll=map.unproject([e.point.x+drag.offX,e.point.y+drag.offY]);

  active.anchor={lng:ll.lng,lat:ll.lat};
  selected={...active.anchor};

  document.getElementById('coords').textContent='الموقع: '+fmt(active.anchor);

 }else if(mode==='rotate'){
  active.group.rotation.y=drag.rotation-(e.point.x-drag.startX)*0.7*Math.PI/180;
 }

 requestRender();
}

function endDrag(){
 if(!drag)return;

 drag=null;
 try{map.dragPan.enable();}catch(err){}
 lastDragEnd=Date.now();
 requestRender();
}

map.on('mousedown',startDrag);
map.on('touchstart',startDrag);
map.on('mousemove',moveDrag);
map.on('touchmove',moveDrag);
map.on('mouseup',endDrag);
map.on('touchend',endDrag);
map.on('touchcancel',endDrag);

window.addEventListener('mouseup',()=>endDrag());
window.addEventListener('touchend',()=>endDrag());
window.addEventListener('touchcancel',()=>endDrag());

// منع تمرير الصفحة أو تكبيرها بالإصبع أثناء سحب المبنى على Safari.
map.getCanvas().addEventListener('touchmove',event=>{
 if(drag)event.preventDefault();
},{passive:false});

document.addEventListener('gesturestart',event=>event.preventDefault());

map.on('click',event=>{
 // اللمسة الأخيرة من السحب تولّد click، نتجاهلها.
 if(Date.now()-lastDragEnd<450)return;

 const point=event.lngLat;

 if(editing&&active){
  if(mode==='move'){
   active.anchor={lng:point.lng,lat:point.lat};
   selected={...active.anchor};

   document.getElementById('coords').textContent='الموقع: '+fmt(active.anchor);

   requestRender();
   msg('تم نقل المبنى إلى الموقع الجديد');
  }

  return;
 }

 choose(point,false);
});

window.addEventListener('resize',()=>map.resize());
window.addEventListener('orientationchange',()=>setTimeout(()=>map.resize(),350));

window.addEventListener('error',event=>{
 console.error('Page error:',event.error||event.message);
 dbg.lastError=String(event.message||'');

 if(isLoading){
  msg('حدث خطأ أثناء تحميل النموذج: '+(event.message||'خطأ غير معروف'),6500);
 }
});
</script>
</body>
</html>
