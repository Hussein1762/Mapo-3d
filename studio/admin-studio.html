
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapo 3D Studio</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#101722;color:white;font-family:Arial}
body{display:flex;flex-direction:column}
header,footer{background:#101722;padding:12px;border-color:#39485d}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid}
footer{border-top:1px solid;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#mapwrap{position:relative;flex:1;min-height:150px}
#map{position:absolute;inset:0}
.btn{background:#347ff0;color:white;border:0;border-radius:10px;padding:11px;margin:3px;font-size:14px}
.alt{background:#29384c}
.hint{font-size:12px;color:#bbc6d5;line-height:1.5;margin:0 0 7px}
.coords{font-size:12px;color:#a9caff;margin:0 0 8px;direction:ltr;text-align:right}
.row{display:flex;gap:6px;flex-wrap:wrap}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:9;align-items:flex-end}
.sheet{background:#192638;border-radius:20px 20px 0 0;border:1px solid #40516a;padding:17px;width:100%;max-height:82%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.sheet p{font-size:12px;color:#bbc6d5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:#29394f;color:white;border:1px solid #40516a;border-radius:12px;padding:14px 8px;text-align:right}
.choice b{display:block}
.choice small{color:#bac6d6}
.field{display:block;margin:12px 0 5px;font-size:13px;color:#cbd5e1}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #50617a;background:#101722;color:white;font-size:15px}
.bar{display:flex;gap:8px;margin-top:12px}
.bar button{flex:1}
.saved{padding:10px;background:#29394f;border-radius:10px;margin:8px 0;font-size:13px}
#map canvas{touch-action:none}
#editToolbar{
 display:none;position:absolute;z-index:8;left:10px;right:10px;bottom:12px;
 background:#142238f2;border:1px solid #526781;border-radius:16px;
 padding:9px;box-shadow:0 5px 24px #0008;backdrop-filter:blur(12px)
}
#editToolbar .toolrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#editToolbar button{
 border:1px solid #536780;border-radius:10px;background:#2b3e56;
 color:white;padding:10px 12px;font-size:13px;min-width:65px
}
#editToolbar button.active{background:#2879ed;border-color:#2879ed}
#editToolbar .actions{display:flex;gap:8px;margin-top:8px}
#editToolbar .actions button{flex:1;font-weight:bold;padding:12px}
#editToolbar .actions .save{background:#247a4b;border-color:#247a4b}
#editToolbar .actions .cancel{background:#a7353d;border-color:#a7353d}
#editToolbar .toolbarHint{text-align:center;font-size:11px;color:#d0d9e6;padding:5px 0 8px}
#toast{display:none;position:fixed;z-index:20;top:65px;left:50%;transform:translateX(-50%);background:#101722;border:1px solid #50617a;padding:10px;border-radius:10px;font-size:12px}
</style>
</head>
<body>

<header>
<b>🌍 Mapo 3D Studio</b>
<div>
<button class="btn alt" onclick="world()">العالم</button>
<button class="btn alt" onclick="tilt()">3D/2D</button>
</div>
</header>

<div id="mapwrap">
<div id="map"></div>

<div id="editToolbar">
 <div class="toolbarHint" id="toolbarHint">اسحب المبنى من موقعه على الخريطة لتغيير مكانه</div>
 <div class="toolrow">
  <button id="tbMove" class="active" onclick="setMode('move')">✥ تحريك</button>
  <button id="tbRotate" onclick="setMode('rotate')">↻ تدوير</button>
  <button onclick="scaleBy(-.1)">－ حجم</button>
  <button onclick="scaleBy(.1)">＋ حجم</button>
  <button onclick="turn(-15)">↶ 15°</button>
  <button onclick="turn(15)">↷ 15°</button>
  <button onclick="elevBy(-1)">خفض</button>
  <button onclick="elevBy(1)">رفع</button>
 </div>
 <div class="actions">
  <button class="save" onclick="saveDraft()">✓ حفظ</button>
  <button class="cancel" onclick="cancelModel()">✕ إلغاء</button>
 </div>
</div>
</div>

<footer>
<p class="hint">حدد الموقع، ارفع نموذج GLB، ثم تحكم بالمبنى من الشريط الظاهر على الخريطة.</p>
<div class="coords" id="coords">لم يتم تحديد موقع</div>
<div class="row">
<button class="btn" onclick="menu()">خيارات الموقع</button>
<button class="btn" onclick="uploadOpen()">＋ رفع مبنى 3D</button>
<button class="btn alt" onclick="savedOpen()">العناصر المحفوظة</button>
</div>
</footer>

<div id="toast"></div>

<div class="scrim" id="menuSheet" onclick="back(event,'menuSheet')">
<section class="sheet">
<h3>شنو تريد تسوي بهذا المكان؟</h3>
<p id="placeText"></p>
<div class="grid">
<button class="choice" onclick="uploadOpen()"><b>📦 رفع مبنى 3D</b><small>GLB</small></button>
<button class="choice" onclick="labelOpen()"><b>📍 إضافة تسمية</b><small>اسم للموقع</small></button>
<button class="choice" onclick="favorite()"><b>⭐ حفظ الموقع</b><small>إضافة للمفضلة</small></button>
<button class="choice" onclick="copyCoords()"><b>🧭 نسخ الإحداثيات</b><small>نسخ الموقع</small></button>
</div>
<div class="bar"><button class="btn alt" onclick="close('menuSheet')">إغلاق</button></div>
</section>
</div>

<div class="scrim" id="uploadSheet" onclick="back(event,'uploadSheet')">
<section class="sheet">
<h3>رفع نموذج المبنى</h3>
<p>اختر ملف GLB.</p>
<label class="field">ملف 3D</label>
<input id="file" type="file" accept=".glb">
<label class="field">اسم المبنى</label>
<input id="name" placeholder="اسم المبنى">
<div class="bar">
<button class="btn" onclick="loadModel()">رفع وعرض المبنى</button>
<button class="btn alt" onclick="close('uploadSheet')">رجوع</button>
</div>
</section>
</div>

<div class="scrim" id="savedSheet" onclick="back(event,'savedSheet')">
<section class="sheet">
<h3>العناصر المحفوظة</h3>
<div id="savedList"></div>
<button class="btn alt" onclick="close('savedSheet')">إغلاق</button>
</section>
</div>

<div class="scrim" id="labelSheet" onclick="back(event,'labelSheet')">
<section class="sheet">
<h3>إضافة تسمية</h3>
<input id="label" placeholder="اسم المكان">
<div class="bar">
<button class="btn" onclick="saveLabel()">حفظ</button>
<button class="btn alt" onclick="close('labelSheet')">رجوع</button>
</div>
</section>
</div>

<script>
const KEY='mapo_studio_glb_v1';
const DB='mapo_glb_files';

let items=JSON.parse(localStorage.getItem(KEY)||'[]');
let selected=null,root=null,scene=null,camera=null,renderer=null;
let anchor=null,blobId=null,modelName='',modelGroup=null;
let modelLayer=null,mode='move',dragState=null,justDragged=false;
let previousModel=null;

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[0,18],
 zoom:1.55
});

map.addControl(new maplibregl.NavigationControl(),'top-right');

/* Arabic map labels */
let rtlReady=false;

try{
 maplibregl.setRTLTextPlugin(
  'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',
  err=>{
   if(err)console.warn('RTL plugin:',err);
   else{rtlReady=true;applyArabicLabels();}
  },
  true
 );
}catch(err){console.warn(err);}

function applyArabicLabels(){
 if(!map.isStyleLoaded())return;
 for(const layer of map.getStyle().layers||[]){
  if(layer.type!=='symbol')continue;
  if(!layer.layout?.['text-field'])continue;
  try{
   map.setLayoutProperty(layer.id,'text-field',[
    'coalesce',
    ['get','name:ar'],
    ['get','name_ar'],
    ['get','name']
   ]);
   map.setLayoutProperty(layer.id,'text-justify','auto');
  }catch(e){console.warn('Arabic label:',layer.id,e);}
 }
}

map.on('style.load',()=>{if(rtlReady)applyArabicLabels();});

function msg(s){
 const e=document.getElementById('toast');
 e.textContent=s;
 e.style.display='block';
 clearTimeout(msg.t);
 msg.t=setTimeout(()=>e.style.display='none',2700);
}

function open(id){document.getElementById(id).style.display='flex';}
function close(id){document.getElementById(id).style.display='none';}
function back(e,id){if(e.target.id===id)close(id);}
function saveMeta(){localStorage.setItem(KEY,JSON.stringify(items));}
function fmt(p){return p.lat.toFixed(5)+', '+p.lng.toFixed(5);}

function choose(ll,show=true){
 selected={lng:ll.lng,lat:ll.lat};
 document.getElementById('coords').textContent='الموقع: '+fmt(selected);
 document.getElementById('placeText').textContent='الإحداثيات: '+fmt(selected);
 if(show)open('menuSheet');
}

function menu(){
 if(root){msg('احفظ المبنى أو ألغِ التعديل أولاً');return;}
 if(!selected){msg('حدد موقعاً أولاً');return;}
 open('menuSheet');
}

function world(){map.flyTo({center:[0,18],zoom:1.55,pitch:0,bearing:0});}
function tilt(){map.easeTo({pitch:map.getPitch()>20?0:55});}

function uploadOpen(){
 if(!selected){msg('حدد مكان المبنى أولاً');return;}
 close('menuSheet');
 open('uploadSheet');
}

function dbOpen(){
 return new Promise((res,rej)=>{
  let r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
 });
}

async function storeFile(id,blob){
 let d=await dbOpen();
 return new Promise((res,rej)=>{
  let t=d.transaction('files','readwrite');
  t.objectStore('files').put({id,blob});
  t.oncomplete=res;
  t.onerror=()=>rej(t.error);
 });
}

async function readFile(id){
 let d=await dbOpen();
 return new Promise((res,rej)=>{
  let r=d.transaction('files').objectStore('files').get(id);
  r.onsuccess=()=>res(r.result?.blob);
  r.onerror=()=>rej(r.error);
 });
}

function init3d(){
 if(scene)return;

 scene=new THREE.Scene();
 camera=new THREE.Camera();

 scene.add(new THREE.HemisphereLight(0xffffff,0x6b7280,2));

 const sun=new THREE.DirectionalLight(0xffffff,2.2);
 sun.position.set(-80,120,80);
 scene.add(sun);

 modelGroup=new THREE.Group();
 scene.add(modelGroup);

 modelLayer={
  id:'mapo-3d-model-layer',
  type:'custom',
  renderingMode:'3d',

  onAdd:function(map,gl){
   renderer=new THREE.WebGLRenderer({
    canvas:map.getCanvas(),
    context:gl,
    antialias:true
   });
   renderer.autoClear=false;
   renderer.outputColorSpace=THREE.SRGBColorSpace;
  },

  render:function(gl,matrix){
   if(!renderer||!root||!anchor)return;

   const mc=maplibregl.MercatorCoordinate.fromLngLat(
    [anchor.lng,anchor.lat],
    Number(document.getElementById('elev').value)
   );

   const meter=mc.meterInMercatorCoordinateUnits();
   const projection=new THREE.Matrix4().fromArray(matrix);
   const translation=new THREE.Matrix4().makeTranslation(mc.x,mc.y,mc.z);
   const scale=new THREE.Matrix4().makeScale(meter,-meter,meter);
   const axis=new THREE.Matrix4().makeRotationX(Math.PI/2);

   camera.projectionMatrix.copy(projection)
    .multiply(translation)
    .multiply(scale)
    .multiply(axis);

   camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

   renderer.resetState();
   renderer.render(scene,camera);
  }
 };

 if(map.isStyleLoaded()&&!map.getLayer(modelLayer.id)){
  map.addLayer(modelLayer);
 }else{
  map.once('load',()=>{
   if(!map.getLayer(modelLayer.id))map.addLayer(modelLayer);
  });
 }
}

function requestRender(){if(map)map.triggerRepaint();}

function fit(obj){
 const bounds=new THREE.Box3().setFromObject(obj);
 const center=bounds.getCenter(new THREE.Vector3());
 const minY=bounds.min.y;
 obj.position.x-=center.x;
 obj.position.z-=center.z;
 obj.position.y-=minY;
}

function setMode(next){
 mode=next;
 document.getElementById('tbMove').classList.toggle('active',mode==='move');
 document.getElementById('tbRotate').classList.toggle('active',mode==='rotate');

 document.getElementById('toolbarHint').textContent=
  mode==='move'?'اسحب المبنى على الخريطة لتغيير مكانه':
  mode==='rotate'?'اسحب يميناً أو يساراً لتدوير المبنى':
  'اختر التحريك أو التدوير';
}

function showToolbar(){
 document.getElementById('editToolbar').style.display='block';
}

function hideToolbar(){
 document.getElementById('editToolbar').style.display='none';
}

function elevBy(n){
 const e=document.getElementById('elev');
 e.value=Math.max(0,Math.min(30,Number(e.value)+n));
 requestRender();
}

async function loadModel(){
 const f=document.getElementById('file').files[0];

 if(!f){msg('اختَر ملف GLB');return;}
 if(!f.name.toLowerCase().endsWith('.glb')){
  msg('ارفع ملف GLB');
  return;
 }

 modelName=document.getElementById('name').value.trim()||f.name;
 msg('جاري تحميل النموذج...');

 const buf=await f.arrayBuffer();
 init3d();

 new THREE.GLTFLoader().parse(buf,'',async g=>{
  if(root)modelGroup.remove(root);

  root=g.scene;
  fit(root);
  modelGroup.add(root);

  anchor={...selected};
  blobId=String(Date.now())+Math.random();

  try{
   await storeFile(blobId,new Blob([buf],{type:'model/gltf-binary'}));
  }catch(e){
   msg('تعذر تخزين الملف محلياً');
  }

  document.getElementById('rot').value=0;
  document.getElementById('scale').value=1;
  document.getElementById('elev').value=0;

  rotation(0);
  scaling(1);
  elevation(0);
  setMode('move');

  map.flyTo({
   center:[anchor.lng,anchor.lat],
   zoom:17,
   pitch:55,
   duration:900
  });

  close('uploadSheet');
  showToolbar();
  requestRender();
  msg('ظهر المبنى على الخريطة. تحكم به من الأدوات الظاهرة');

 },e=>msg('تعذر قراءة النموذج: '+e.message));
}

function rotation(v){
 if(root)root.rotation.y=Number(v)*Math.PI/180;
 requestRender();
}

function scaling(v){
 if(root)root.scale.setScalar(Number(v));
 requestRender();
}

function elevation(v){requestRender();}

function turn(n){
 const current=root?root.rotation.y*180/Math.PI:0;
 if(root)root.rotation.y=(current+n)*Math.PI/180;
 requestRender();
}

function scaleBy(n){
 if(!root)return;
 const next=Math.max(.25,Math.min(3,root.scale.x+n));
 root.scale.setScalar(next);
 requestRender();
}

function saveDraft(){
 if(!root||!anchor)return;

 const record={
  id:blobId,
  type:'model',
  name:modelName,
  fileId:blobId,
  lng:anchor.lng,
  lat:anchor.lat,
  rotation:root.rotation.y*180/Math.PI,
  scale:root.scale.x,
  elevation:Number(document.getElementById('elev').value),
  status:'draft'
 };

 items=items.filter(x=>x.id!==blobId);
 items.push(record);
 saveMeta();

 previousModel=null;
 hideToolbar();
 msg('تم حفظ المبنى محلياً على هذا الجهاز');
}

function cancelModel(){
 if(root&&modelGroup)modelGroup.remove(root);
 root=null;
 anchor=null;
 hideToolbar();
 requestRender();
 msg('تم إلغاء المبنى');
}

function labelOpen(){
 close('menuSheet');
 open('labelSheet');
}

function saveLabel(){
 const n=document.getElementById('label').value.trim();
 if(!n||!selected)return;

 items.push({
  id:String(Date.now()),
  type:'label',
  name:n,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 saveMeta();
 close('labelSheet');
 msg('تم حفظ التسمية محلياً');
}

function favorite(){
 if(!selected)return;
 const n=prompt('اسم الموقع','موقع محفوظ');
 if(n===null)return;

 items.push({
  id:String(Date.now()),
  type:'favorite',
  name:n,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 saveMeta();
 close('menuSheet');
 msg('تم حفظ الموقع');
}

function copyCoords(){
 if(!selected)return;
 const s=selected.lng+', '+selected.lat;

 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(s)
   .then(()=>msg('تم نسخ الإحداثيات'))
   .catch(()=>msg(s));
 }else msg(s);

 close('menuSheet');
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function savedOpen(){
 const b=document.getElementById('savedList');

 b.innerHTML=items.length
 ?items.map(x=>`
  <div class="saved">
   <b>${esc(x.name)}</b>
   <small>${x.type} · ${x.status||'draft'} · ${x.lat.toFixed(5)}, ${x.lng.toFixed(5)}</small>
   <button class="btn alt" onclick="focusItem('${x.id}')">عرض</button>
   <button class="btn alt" onclick="deleteItem('${x.id}')">حذف</button>
  </div>
 `).join('')
 :'<p>لا توجد عناصر محفوظة.</p>';

 open('savedSheet');
}

async function focusItem(id){
 const x=items.find(a=>a.id===id);
 if(!x)return;

 close('savedSheet');
 selected={lng:x.lng,lat:x.lat};

 map.flyTo({center:[x.lng,x.lat],zoom:17,pitch:50});

 if(x.type!=='model')return;

 const blob=await readFile(x.fileId);
 if(!blob){
  msg('ملف النموذج غير موجود بهذا المتصفح');
  return;
 }

 const url=URL.createObjectURL(blob);
 init3d();

 new THREE.GLTFLoader().load(url,g=>{
  if(root)modelGroup.remove(root);

  root=g.scene;
  fit(root);
  modelGroup.add(root);

  anchor={lng:x.lng,lat:x.lat};
  blobId=x.fileId;
  modelName=x.name;

  root.scale.setScalar(x.scale||1);
  root.rotation.y=(x.rotation||0)*Math.PI/180;

  document.getElementById('elev').value=x.elevation||0;

  setMode('move');
  showToolbar();
  requestRender();

  URL.revokeObjectURL(url);
 });
}

async function deleteItem(id){
 const x=items.find(a=>a.id===id);
 if(!x||!confirm('تأكيد الحذف؟'))return;

 items=items.filter(a=>a.id!==id);
 saveMeta();

 if(x.fileId){
  const d=await dbOpen();
  d.transaction('files','readwrite').objectStore('files').delete(x.fileId);
 }

 savedOpen();
}

map.on('move',requestRender);
map.on('zoom',requestRender);
map.on('pitch',requestRender);
map.on('rotate',requestRender);
map.on('load',()=>{
 init3d();
 requestRender();
});

function canvasPoint(e){
 const r=map.getCanvas().getBoundingClientRect();
 return [e.clientX-r.left,e.clientY-r.top];
}

const mapCanvas=map.getCanvas();

mapCanvas.addEventListener('pointerdown',e=>{
 if(!root||!anchor||mode==='none')return;
 if(e.pointerType==='mouse'&&e.button!==0)return;

 const rect=mapCanvas.getBoundingClientRect();
 const pt=[e.clientX-rect.left,e.clientY-rect.top];
 const modelPt=map.project([anchor.lng,anchor.lat]);

 if(Math.hypot(pt[0]-modelPt.x,pt[1]-modelPt.y)>115)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 map.dragPan.disable();
 mapCanvas.setPointerCapture?.(e.pointerId);

 dragState={
  id:e.pointerId,
  x:e.clientX,
  y:e.clientY,
  rotation:root.rotation.y*180/Math.PI
 };
},{capture:true});

mapCanvas.addEventListener('pointermove',e=>{
 if(!dragState||dragState.id!==e.pointerId)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 if(mode==='move'){
  const p=canvasPoint(e);
  const ll=map.unproject(p);
  anchor={lng:ll.lng,lat:ll.lat};
  document.getElementById('coords').textContent='الموقع: '+fmt(anchor);
 }else if(mode==='rotate'){
  const delta=e.clientX-dragState.x;
  root.rotation.y=(dragState.rotation+delta*.7)*Math.PI/180;
 }

 requestRender();
},{capture:true});

function finishDirectDrag(e){
 if(!dragState)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 dragState=null;
 justDragged=true;
 map.dragPan.enable();
 requestRender();
}

mapCanvas.addEventListener('pointerup',finishDirectDrag,{capture:true});
mapCanvas.addEventListener('pointercancel',finishDirectDrag,{capture:true});

mapCanvas.addEventListener('click',e=>{
 if(justDragged){
  justDragged=false;
  return;
 }

 if(!root){
  const r=mapCanvas.getBoundingClientRect();
  const ll=map.unproject([e.clientX-r.left,e.clientY-r.top]);
  choose(ll,false);
 }
});
</script>
</body>
</html>
