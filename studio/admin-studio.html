
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mapo 3D Studio</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#101722;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
header,footer{background:#101722;padding:11px 12px;border-color:#39485d;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #39485d;min-height:62px}
footer{border-top:1px solid #39485d;padding-bottom:calc(11px + env(safe-area-inset-bottom))}
#mapwrap{position:relative;flex:1;min-height:150px}
#map{position:absolute;inset:0}
.btn{background:#347ff0;color:#fff;border:0;border-radius:10px;padding:11px;margin:3px;font-size:14px}
.alt{background:#29384c}
.hint{font-size:12px;color:#bbc6d5;line-height:1.5;margin:0 0 7px}
.coords{font-size:12px;color:#a9caff;margin:0 0 8px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.row{display:flex;gap:6px;flex-wrap:wrap}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:9;align-items:flex-end}
.sheet{background:#192638;border-radius:20px 20px 0 0;border:1px solid #40516a;padding:17px;width:100%;max-height:82%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.sheet p{font-size:12px;color:#bbc6d5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:#29394f;color:#fff;border:1px solid #40516a;border-radius:12px;padding:14px 8px;text-align:right}
.choice b{display:block}
.choice small{color:#bac6d6}
.field{display:block;margin:12px 0 5px;font-size:13px;color:#cbd5e1}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #50617a;background:#101722;color:#fff;font-size:15px}
.bar{display:flex;gap:8px;margin-top:12px}
.bar button{flex:1}
.saved{padding:10px;background:#29394f;border-radius:10px;margin:8px 0;font-size:13px;overflow-wrap:anywhere}
#editToolbar{display:none;position:absolute;z-index:8;left:9px;right:9px;bottom:10px;background:#142238f2;border:1px solid #526781;border-radius:15px;padding:8px;box-shadow:0 5px 24px #0008;backdrop-filter:blur(12px)}
#editToolbar .toolrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
#editToolbar button{border:1px solid #536780;border-radius:9px;background:#2b3e56;color:#fff;padding:9px 10px;font-size:12px;min-width:58px}
#editToolbar button.active{background:#2879ed;border-color:#2879ed}
#editToolbar .actions{display:flex;gap:8px;margin-top:8px}
#editToolbar .actions button{flex:1;font-weight:bold;padding:11px;font-size:14px}
.save{background:#247a4b!important;border-color:#247a4b!important}
.cancel{background:#a7353d!important;border-color:#a7353d!important}
.toolbarHint{text-align:center;font-size:11px;color:#d0d9e6;padding:4px 0 7px}
#toast{display:none;position:fixed;z-index:20;top:calc(65px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#101722;border:1px solid #50617a;padding:10px 13px;border-radius:10px;font-size:12px;max-width:90%;text-align:center;box-shadow:0 4px 20px #0008}
.busy{opacity:.65;pointer-events:none}
#map canvas{touch-action:none}
</style>
</head>
<body>
<header>
<b>🌍 Mapo 3D Studio</b>
<div>
<button class="btn alt" onclick="world()">العالم</button>
<button class="btn alt" onclick="tilt()">3D/2D</button>
</div>
</header>

<div id="mapwrap">
<div id="map"></div>
<div id="editToolbar">
 <div class="toolbarHint" id="toolbarHint">اسحب قرب مركز المبنى لتحريك موقعه</div>
 <div class="toolrow">
  <button id="tbMove" class="active" onclick="setMode('move')">✥ تحريك</button>
  <button id="tbRotate" onclick="setMode('rotate')">↻ تدوير</button>
  <button onclick="scaleBy(-0.1)">－ حجم</button>
  <button onclick="scaleBy(0.1)">＋ حجم</button>
  <button onclick="turn(-15)">↶ 15°</button>
  <button onclick="turn(15)">↷ 15°</button>
  <button onclick="elevBy(-1)">خفض</button>
  <button onclick="elevBy(1)">رفع</button>
 </div>
 <div class="actions">
  <button class="save" onclick="saveDraft()">✓ حفظ</button>
  <button class="cancel" onclick="cancelModel()">✕ إلغاء</button>
 </div>
</div>
</div>

<footer>
<p class="hint">حدد الموقع على الخريطة، ارفع نموذج GLB، ثم عدّل مكانه وحجمه واتجاهه.</p>
<div class="coords" id="coords">لم يتم تحديد موقع</div>
<div class="row">
<button class="btn" onclick="menu()">خيارات الموقع</button>
<button class="btn" onclick="uploadOpen()">＋ رفع مبنى 3D</button>
<button class="btn alt" onclick="savedOpen()">العناصر المحفوظة</button>
</div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<div class="scrim" id="menuSheet" onclick="back(event,'menuSheet')">
<section class="sheet">
<h3>شنو تريد تسوي بهذا المكان؟</h3>
<p id="placeText"></p>
<div class="grid">
<button class="choice" onclick="uploadOpen()"><b>📦 رفع مبنى 3D</b><small>GLB</small></button>
<button class="choice" onclick="labelOpen()"><b>📍 إضافة تسمية</b><small>اسم للموقع</small></button>
<button class="choice" onclick="favorite()"><b>⭐ حفظ الموقع</b><small>إضافة للمفضلة</small></button>
<button class="choice" onclick="copyCoords()"><b>🧭 نسخ الإحداثيات</b><small>نسخ الموقع</small></button>
</div>
<div class="bar"><button class="btn alt" onclick="close('menuSheet')">إغلاق</button></div>
</section>
</div>

<div class="scrim" id="uploadSheet" onclick="back(event,'uploadSheet')">
<section class="sheet">
<h3>رفع نموذج المبنى</h3>
<p>اختر ملف GLB. الملفات الكبيرة قد تستغرق وقتاً أطول حسب الجهاز.</p>
<label class="field" for="file">ملف 3D</label>
<input id="file" type="file" accept=".glb,model/gltf-binary">
<label class="field" for="name">اسم المبنى</label>
<input id="name" placeholder="اسم المبنى">
<div class="bar">
<button class="btn" id="uploadBtn" onclick="loadModel()">رفع وعرض المبنى</button>
<button class="btn alt" onclick="close('uploadSheet')">رجوع</button>
</div>
</section>
</div>

<div class="scrim" id="savedSheet" onclick="back(event,'savedSheet')">
<section class="sheet">
<h3>العناصر المحفوظة</h3>
<div id="savedList"></div>
<button class="btn alt" onclick="close('savedSheet')">إغلاق</button>
</section>
</div>

<div class="scrim" id="labelSheet" onclick="back(event,'labelSheet')">
<section class="sheet">
<h3>إضافة تسمية</h3>
<input id="label" placeholder="اسم المكان">
<div class="bar">
<button class="btn" onclick="saveLabel()">حفظ</button>
<button class="btn alt" onclick="close('labelSheet')">رجوع</button>
</div>
</section>
</div>

<script>
'use strict';

const KEY='mapo_studio_glb_v2';
const DB='mapo_glb_files_v2';

let items=[];
try{
 items=JSON.parse(localStorage.getItem(KEY)||'[]');
 if(!Array.isArray(items))items=[];
}catch(e){items=[];}

let selected=null,root=null,scene=null,camera=null,renderer=null;
let anchor=null,blobId=null,modelName='',modelGroup=null,modelLayer=null;
let mode='move',dragState=null,justDragged=false;
let elevationMeters=0,originalState=null,isLoading=false,isExistingModel=false;

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[0,18],
 zoom:1.55,
 antialias:true
});

map.addControl(new maplibregl.NavigationControl(),'top-right');

let rtlReady=false;

try{
 maplibregl.setRTLTextPlugin(
  'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',
  err=>{
   if(err)console.warn('RTL plugin:',err);
   else{
    rtlReady=true;
    applyArabicLabels();
   }
  },
  true
 );
}catch(err){console.warn('RTL plugin unavailable',err);}

function applyArabicLabels(){
 if(!map.isStyleLoaded())return;
 for(const layer of map.getStyle().layers||[]){
  if(layer.type!=='symbol'||!layer.layout?.['text-field'])continue;
  try{
   map.setLayoutProperty(layer.id,'text-field',[
    'coalesce',
    ['get','name:ar'],
    ['get','name_ar'],
    ['get','name']
   ]);
   map.setLayoutProperty(layer.id,'text-justify','auto');
  }catch(e){console.warn('Arabic label',layer.id,e);}
 }
}

map.on('style.load',()=>{
 if(rtlReady)applyArabicLabels();
});

function msg(s,ms=3200){
 const e=document.getElementById('toast');
 e.textContent=s;
 e.style.display='block';
 clearTimeout(msg.t);
 msg.t=setTimeout(()=>e.style.display='none',ms);
}

function open(id){document.getElementById(id).style.display='flex';}
function close(id){document.getElementById(id).style.display='none';}
function back(e,id){if(e.target.id===id)close(id);}

function saveMeta(){
 try{
  localStorage.setItem(KEY,JSON.stringify(items));
  return true;
 }catch(e){
  msg('تعذر حفظ البيانات: مساحة التخزين ممتلئة أو غير متاحة');
  return false;
 }
}

function fmt(p){
 return Number(p.lat).toFixed(5)+', '+Number(p.lng).toFixed(5);
}

function choose(ll,show=true){
 selected={lng:ll.lng,lat:ll.lat};
 document.getElementById('coords').textContent='الموقع: '+fmt(selected);
 document.getElementById('placeText').textContent='الإحداثيات: '+fmt(selected);
 if(show)open('menuSheet');
}

function menu(){
 if(root){
  msg('احفظ المبنى أو ألغِ التعديل أولاً');
  return;
 }
 if(!selected){
  msg('اضغط على الخريطة لتحديد الموقع أولاً');
  return;
 }
 open('menuSheet');
}

function world(){
 map.flyTo({center:[0,18],zoom:1.55,pitch:0,bearing:0});
}

function tilt(){
 map.easeTo({pitch:map.getPitch()>20?0:55});
}

function uploadOpen(){
 if(root){
  msg('أنهِ تعديل المبنى الحالي بالحفظ أو الإلغاء أولاً');
  return;
 }
 if(!selected){
  msg('حدد موقعاً على الخريطة أولاً');
  return;
 }
 close('menuSheet');
 open('uploadSheet');
}

function dbOpen(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains('files')){
    r.result.createObjectStore('files',{keyPath:'id'});
   }
  };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error||new Error('تعذر فتح قاعدة الملفات'));
 });
}

async function storeFile(id,blob){
 const d=await dbOpen();
 return new Promise((res,rej)=>{
  const t=d.transaction('files','readwrite');
  t.objectStore('files').put({id,blob});
  t.oncomplete=()=>{
   d.close();
   res();
  };
  t.onerror=()=>{
   const e=t.error;
   d.close();
   rej(e||new Error('فشل تخزين الملف'));
  };
  t.onabort=()=>{
   const e=t.error;
   d.close();
   rej(e||new Error('تم إلغاء تخزين الملف'));
  };
 });
}

async function readFile(id){
 const d=await dbOpen();
 return new Promise((res,rej)=>{
  const t=d.transaction('files','readonly');
  const r=t.objectStore('files').get(id);
  r.onsuccess=()=>{
   const value=r.result?.blob;
   d.close();
   res(value);
  };
  r.onerror=()=>{
   const e=r.error;
   d.close();
   rej(e||new Error('تعذر قراءة الملف'));
  };
 });
}

async function deleteStoredFile(id){
 const d=await dbOpen();
 return new Promise((res,rej)=>{
  const t=d.transaction('files','readwrite');
  t.objectStore('files').delete(id);
  t.oncomplete=()=>{
   d.close();
   res();
  };
  t.onerror=()=>{
   const e=t.error;
   d.close();
   rej(e);
  };
 });
}

function init3d(){
 if(scene)return;

 if(!window.THREE||!THREE.GLTFLoader){
  throw new Error('مكتبة Three.js أو GLTFLoader لم يتم تحميلها. حدّث الصفحة وتأكد من الاتصال بالإنترنت.');
 }

 scene=new THREE.Scene();
 camera=new THREE.Camera();

 scene.add(new THREE.HemisphereLight(0xffffff,0x6b7280,1.8));

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(-80,120,80);
 scene.add(sun);

 modelGroup=new THREE.Group();
 scene.add(modelGroup);

 modelLayer={
  id:'mapo-3d-model-layer',
  type:'custom',
  renderingMode:'3d',

  onAdd:function(m,gl){
   renderer=new THREE.WebGLRenderer({
    canvas:m.getCanvas(),
    context:gl,
    antialias:true
   });
   renderer.autoClear=false;
   if('outputEncoding'in renderer&&THREE.sRGBEncoding){
    renderer.outputEncoding=THREE.sRGBEncoding;
   }
  },

  render:function(gl,matrix){
   if(!renderer||!root||!anchor)return;

   const mc=maplibregl.MercatorCoordinate.fromLngLat(
    [anchor.lng,anchor.lat],
    elevationMeters
   );

   const meter=mc.meterInMercatorCoordinateUnits();
   const projection=new THREE.Matrix4().fromArray(matrix);

   const modelMatrix=new THREE.Matrix4()
    .makeTranslation(mc.x,mc.y,mc.z)
    .scale(new THREE.Vector3(meter,-meter,meter))
    .multiply(new THREE.Matrix4().makeRotationX(Math.PI/2));

   camera.projectionMatrix.copy(projection).multiply(modelMatrix);
   camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

   renderer.resetState();
   renderer.render(scene,camera);
  }
 };

 if(map.isStyleLoaded()){
  if(!map.getLayer(modelLayer.id))map.addLayer(modelLayer);
 }else{
  map.once('load',()=>{
   if(!map.getLayer(modelLayer.id))map.addLayer(modelLayer);
  });
 }
}

function requestRender(){
 if(map)map.triggerRepaint();
}

function fit(obj){
 const bounds=new THREE.Box3().setFromObject(obj);
 if(bounds.isEmpty())return;

 const center=bounds.getCenter(new THREE.Vector3());
 const minY=bounds.min.y;

 obj.position.x-=center.x;
 obj.position.z-=center.z;
 obj.position.y-=minY;
}

function setMode(next){
 mode=next;

 document.getElementById('tbMove').classList.toggle('active',mode==='move');
 document.getElementById('tbRotate').classList.toggle('active',mode==='rotate');

 document.getElementById('toolbarHint').textContent=
  mode==='move'
   ?'اسحب قرب مركز المبنى لتحريك موقعه'
   :'اسحب يميناً أو يساراً لتدوير المبنى';
}

function showToolbar(){
 document.getElementById('editToolbar').style.display='block';
}

function hideToolbar(){
 document.getElementById('editToolbar').style.display='none';
}

function elevation(n){
 elevationMeters=Math.max(0,Math.min(100,Number(n)||0));
 requestRender();
}

function elevBy(n){
 elevation(elevationMeters+n);
}

function rotation(v){
 if(root)root.rotation.y=Number(v)*Math.PI/180;
 requestRender();
}

function scaling(v){
 if(root)root.scale.setScalar(Number(v));
 requestRender();
}

function turn(n){
 if(!root)return;
 root.rotation.y+=n*Math.PI/180;
 requestRender();
}

function scaleBy(n){
 if(!root)return;
 const next=Math.max(.1,Math.min(10,root.scale.x+n));
 root.scale.setScalar(next);
 requestRender();
}

function captureState(){
 if(!root||!anchor)return null;
 return{
  position:{...anchor},
  rotation:root.rotation.y,
  scale:root.scale.x,
  elevation:elevationMeters
 };
}

function restoreState(s){
 if(!s||!root)return;
 anchor={...s.position};
 root.rotation.y=s.rotation;
 root.scale.setScalar(s.scale);
 elevationMeters=s.elevation;
 requestRender();
}

function parseGLB(buffer){
 return new Promise((resolve,reject)=>{
  try{
   new THREE.GLTFLoader().parse(
    buffer,
    '',
    g=>resolve(g),
    e=>reject(e||new Error('GLB parse failed'))
   );
  }catch(e){
   reject(e);
  }
 });
}

async function loadModel(){
 if(isLoading)return;

 const f=document.getElementById('file').files?.[0];

 if(!f){
  msg('اختَر ملف GLB أولاً');
  return;
 }

 if(!f.name.toLowerCase().endsWith('.glb')){
  msg('الملف لازم يكون بصيغة GLB');
  return;
 }

 if(!selected){
  msg('حدد موقع المبنى على الخريطة أولاً');
  return;
 }

 if(f.size===0){
  msg('الملف فارغ');
  return;
 }

 if(f.size>250*1024*1024){
  msg('حجم الملف أكبر من الحد المسموح (250MB)');
  return;
 }

 isLoading=true;

 const btn=document.getElementById('uploadBtn');
 btn.disabled=true;
 btn.textContent='جاري التحميل...';
 document.getElementById('uploadSheet').classList.add('busy');

 msg('جاري قراءة ملف النموذج...',12000);

 try{
  const buffer=await f.arrayBuffer();

  if(buffer.byteLength<12){
   throw new Error('الملف صغير أو غير مكتمل');
  }

  const magic=new DataView(buffer).getUint32(0,true);

  if(magic!==0x46546c67){
   throw new Error('محتوى الملف ليس GLB صالحاً');
  }

  init3d();

  const gltf=await parseGLB(buffer);

  if(!gltf?.scene){
   throw new Error('لم يعثر القارئ على مشهد داخل الملف');
  }

  const newRoot=gltf.scene;
  fit(newRoot);

  const newId='glb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);

  try{
   await storeFile(
    newId,
    new Blob([buffer],{type:'model/gltf-binary'})
   );
  }catch(storageError){
   throw new Error('تمت قراءة النموذج لكن تعذر حفظ نسخة محلية منه: '+(storageError.message||'مساحة التخزين'));
  }

  if(root&&modelGroup)modelGroup.remove(root);

  root=newRoot;
  modelGroup.add(root);

  anchor={...selected};
  blobId=newId;
  isExistingModel=false;

  modelName=document.getElementById('name').value.trim()||
   f.name.replace(/\.glb$/i,'');

  elevationMeters=0;
  root.rotation.set(0,0,0);
  root.scale.setScalar(1);

  originalState=captureState();

  setMode('move');

  map.flyTo({
   center:[anchor.lng,anchor.lat],
   zoom:17,
   pitch:55,
   duration:900
  });

  close('uploadSheet');
  showToolbar();
  requestRender();

  msg('تم تحميل النموذج. تقدر تعدّل مكانه وحجمه واتجاهه.');

 }catch(e){
  console.error('GLB load error:',e);
  msg('فشل تحميل النموذج: '+(e?.message||String(e)),6500);

 }finally{
  isLoading=false;
  btn.disabled=false;
  btn.textContent='رفع وعرض المبنى';
  document.getElementById('uploadSheet').classList.remove('busy');
 }
}

function saveDraft(){
 if(!root||!anchor||!blobId){
  msg('ماكو نموذج مفتوح للحفظ');
  return;
 }

 const record={
  id:blobId,
  type:'model',
  name:modelName,
  fileId:blobId,
  lng:anchor.lng,
  lat:anchor.lat,
  rotation:root.rotation.y*180/Math.PI,
  scale:root.scale.x,
  elevation:elevationMeters,
  status:'draft'
 };

 const old=items;

 items=items.filter(x=>x.id!==blobId);
 items.push(record);

 if(!saveMeta()){
  items=old;
  return;
 }

 originalState=null;
 isExistingModel=true;
 hideToolbar();

 root=null;
 anchor=null;
 blobId=null;
 modelName='';

 requestRender();

 msg('تم حفظ المبنى محلياً على هذا الجهاز');
}

function cancelModel(){
 if(!root)return;

 const id=blobId;
 const wasSaved=isExistingModel;

 if(modelGroup)modelGroup.remove(root);

 root=null;
 anchor=null;
 blobId=null;
 modelName='';
 originalState=null;
 elevationMeters=0;
 isExistingModel=false;

 hideToolbar();
 requestRender();

 if(id&&!wasSaved){
  deleteStoredFile(id).catch(e=>console.warn('temporary model cleanup:',e));
 }

 msg(wasSaved
  ?'تم إغلاق التعديل، والنسخة المحفوظة ما زالت موجودة'
  :'تم إلغاء النموذج');
}

function labelOpen(){
 close('menuSheet');
 open('labelSheet');
}

function saveLabel(){
 const n=document.getElementById('label').value.trim();

 if(!n||!selected)return;

 items.push({
  id:'label_'+Date.now(),
  type:'label',
  name:n,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 if(saveMeta()){
  close('labelSheet');
  msg('تم حفظ التسمية محلياً');
 }
}

function favorite(){
 if(!selected)return;

 const n=prompt('اسم الموقع','موقع محفوظ');
 if(n===null)return;

 items.push({
  id:'fav_'+Date.now(),
  type:'favorite',
  name:n,
  lng:selected.lng,
  lat:selected.lat,
  status:'draft'
 });

 if(saveMeta()){
  close('menuSheet');
  msg('تم حفظ الموقع محلياً');
 }
}

function copyCoords(){
 if(!selected)return;

 const s=selected.lng+', '+selected.lat;

 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(s)
   .then(()=>msg('تم نسخ الإحداثيات'))
   .catch(()=>msg(s));
 }else{
  msg(s);
 }

 close('menuSheet');
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function savedOpen(){
 const b=document.getElementById('savedList');

 b.innerHTML=items.length
  ?items.map(x=>`
   <div class="saved">
    <b>${esc(x.name)}</b><br>
    <small>${esc(x.type)} · ${esc(x.status||'draft')} · ${Number(x.lat).toFixed(5)}, ${Number(x.lng).toFixed(5)}</small><br>
    <button class="btn alt" onclick="focusItem('${esc(x.id)}')">عرض</button>
    <button class="btn alt" onclick="deleteItem('${esc(x.id)}')">حذف</button>
   </div>
  `).join('')
  :'<p>لا توجد عناصر محفوظة.</p>';

 open('savedSheet');
}

async function focusItem(id){
 const x=items.find(a=>a.id===id);
 if(!x)return;

 close('savedSheet');

 selected={lng:x.lng,lat:x.lat};
 document.getElementById('coords').textContent='الموقع: '+fmt(selected);

 map.flyTo({
  center:[x.lng,x.lat],
  zoom:17,
  pitch:50
 });

 if(x.type!=='model')return;

 try{
  const blob=await readFile(x.fileId);

  if(!blob){
   throw new Error('الملف غير موجود في التخزين المحلي لهذا المتصفح');
  }

  const buffer=await blob.arrayBuffer();

  init3d();

  const gltf=await parseGLB(buffer);

  if(root&&modelGroup)modelGroup.remove(root);

  root=gltf.scene;
  fit(root);
  modelGroup.add(root);

  anchor={lng:x.lng,lat:x.lat};
  blobId=x.fileId;
  isExistingModel=true;
  modelName=x.name;

  root.scale.setScalar(Number(x.scale)||1);
  root.rotation.y=(Number(x.rotation)||0)*Math.PI/180;

  elevationMeters=Number(x.elevation)||0;
  originalState=captureState();

  setMode('move');
  showToolbar();
  requestRender();

  msg('تم فتح المبنى المحفوظ');

 }catch(e){
  console.error('Open saved model:',e);
  msg('تعذر فتح المبنى: '+(e.message||String(e)),6000);
 }
}

async function deleteItem(id){
 const x=items.find(a=>a.id===id);

 if(!x||!confirm('تأكيد الحذف؟'))return;

 items=items.filter(a=>a.id!==id);

 if(!saveMeta())return;

 if(x.fileId){
  try{
   await deleteStoredFile(x.fileId);
  }catch(e){
   console.warn(e);
  }
 }

 if(blobId===x.fileId)cancelModel();

 savedOpen();
}

map.on('move',requestRender);
map.on('zoom',requestRender);
map.on('pitch',requestRender);
map.on('rotate',requestRender);

map.on('load',()=>{
 try{
  init3d();
  requestRender();
 }catch(e){
  console.error(e);
  msg(e.message);
 }
});

function canvasPoint(e){
 const r=map.getCanvas().getBoundingClientRect();
 return[e.clientX-r.left,e.clientY-r.top];
}

const mapCanvas=map.getCanvas();

mapCanvas.addEventListener('pointerdown',e=>{
 if(!root||!anchor)return;
 if(e.pointerType==='mouse'&&e.button!==0)return;

 const p=canvasPoint(e);
 const mp=map.project([anchor.lng,anchor.lat]);

 if(Math.hypot(p[0]-mp.x,p[1]-mp.y)>125)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 map.dragPan.disable();

 try{
  mapCanvas.setPointerCapture(e.pointerId);
 }catch(_){}

 dragState={
  id:e.pointerId,
  x:e.clientX,
  y:e.clientY,
  rotation:root.rotation.y*180/Math.PI
 };
},{capture:true});

mapCanvas.addEventListener('pointermove',e=>{
 if(!dragState||dragState.id!==e.pointerId)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 if(mode==='move'){
  const ll=map.unproject(canvasPoint(e));

  anchor={lng:ll.lng,lat:ll.lat};

  document.getElementById('coords').textContent='الموقع: '+fmt(anchor);

 }else if(mode==='rotate'){
  root.rotation.y=
   (dragState.rotation+(e.clientX-dragState.x)*.7)*Math.PI/180;
 }

 requestRender();
},{capture:true});

function finishDirectDrag(e){
 if(!dragState)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 dragState=null;
 justDragged=true;

 map.dragPan.enable();
 requestRender();
}

mapCanvas.addEventListener('pointerup',finishDirectDrag,{capture:true});
mapCanvas.addEventListener('pointercancel',finishDirectDrag,{capture:true});

mapCanvas.addEventListener('click',e=>{
 if(justDragged){
  justDragged=false;
  return;
 }

 if(!root){
  const ll=map.unproject(canvasPoint(e));
  choose(ll,false);
 }
});

window.addEventListener('error',e=>{
 console.error('Page error:',e.error||e.message);

 if(isLoading){
  msg('حدث خطأ أثناء تحميل النموذج: '+(e.message||'خطأ غير معروف'),6500);
 }
});
</script>
</body>
